<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e74c3c">
<title>Multiplication Patterns & Digit Count</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#e74c3c 0%,#f59e0b 100%);min-height:100vh;-webkit-font-smoothing:antialiased}
#app{max-width:420px;margin:auto;padding:10px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:18px;font-weight:700;margin-bottom:4px}
.header p{font-size:12px;opacity:.9}
.sim-card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.15);margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;color:#c0392b;margin-bottom:8px}
.mode-tabs{display:flex;gap:6px;margin-bottom:12px}
.mode-tab{flex:1;padding:10px 4px;border:2px solid #e0e0e0;border-radius:8px;background:#fafafa;font-size:10px;font-weight:600;text-align:center;cursor:pointer}
.mode-tab:active{transform:scale(.98)}
.mode-tab.active{border-color:#e74c3c;background:#fef2f2;color:#991b1b}
/* Result panel */
.result-panel{background:linear-gradient(135deg,#fef2f2 0%,#fecaca 100%);border-radius:12px;padding:16px;text-align:center;border:2px solid #f87171;margin-bottom:10px}
.result-label{font-size:11px;color:#991b1b;font-weight:600}
.result-value{font-size:28px;font-weight:800;color:#991b1b;margin:4px 0;font-variant-numeric:tabular-nums}
.result-sub{font-size:11px;color:#b91c1c}
/* Factor blocks */
.factor-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.factor-block{padding:10px 16px;border-radius:10px;font-size:16px;font-weight:700;color:#fff;text-align:center}
.factor-block.a{background:#3b82f6}
.factor-block.b{background:#ef4444}
.factor-block .fd{font-size:9px;font-weight:400;opacity:.8;margin-top:2px}
.factor-x{font-size:22px;font-weight:800;color:#555}
/* Digit rule badge */
.rule-badge{display:inline-block;padding:8px 16px;border-radius:16px;font-size:12px;font-weight:600;margin:6px 0}
.rule-badge.pass{background:#dcfce7;color:#166534}
.rule-badge.fail{background:#fef2f2;color:#991b1b}
/* Pattern table */
.ptable{width:100%;border-collapse:collapse;font-size:11px;margin:8px 0}
.ptable th{background:#fef2f2;padding:6px;text-align:center;font-weight:600;color:#991b1b;border-bottom:2px solid #fecaca}
.ptable td{padding:5px 6px;text-align:center;border-bottom:1px solid #f5f5f5;color:#333}
.ptable td.hl{background:#fef3c7;font-weight:700}
.ptable td.prod{color:#c0392b;font-weight:700}
/* Sliders */
.slider-group{margin-bottom:10px}
.slider-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.slider-label .name{color:#555}
.slider-label .val{font-weight:700;color:#e74c3c}
input[type="range"]{width:100%;height:6px;border-radius:3px;background:#e5e7eb;-webkit-appearance:none;outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#e74c3c;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.preset-btn{padding:6px 10px;border-radius:16px;border:2px solid #fecaca;background:#fff;font-size:10px;font-weight:600;cursor:pointer;color:#991b1b}
.preset-btn:active{transform:scale(.95)}
/* Shortcut cards */
.sc-card{background:#fef2f2;border-radius:10px;padding:10px;margin-bottom:8px;border-left:4px solid #e74c3c}
.sc-card .sc-title{font-size:12px;font-weight:700;color:#991b1b;margin-bottom:4px}
.sc-card .sc-rule{font-size:11px;color:#c0392b;font-weight:600;margin-bottom:4px}
.sc-card .sc-ex{font-size:11px;color:#555;line-height:1.5}
/* Digit rule grid */
.dg-grid{display:grid;grid-template-columns:30px repeat(5,1fr);gap:2px;margin:8px 0}
.dg-cell{padding:6px 2px;text-align:center;border-radius:4px;font-size:10px;font-weight:600}
.dg-header{background:#fef2f2;color:#991b1b;font-weight:700}
.dg-body{background:#f8fafc;color:#334155}
.dg-highlight{outline:3px solid #e74c3c;outline-offset:-1px;z-index:1}
/* Insight */
.insight-box{background:linear-gradient(135deg,#fef2f2 0%,#fecaca 100%);border-radius:10px;padding:12px;margin-top:12px;border-left:4px solid #e74c3c;font-size:12px;line-height:1.5}
.insight-title{font-weight:700;color:#991b1b;margin-bottom:4px}
.rule-highlight{background:#fff;border-radius:8px;padding:10px;margin-top:8px;text-align:center;font-size:14px;font-weight:700;color:#991b1b}
</style>
</head>
<body>
<div id="app">
<div class="header">
  <h1>Multiplication Patterns</h1>
  <p>Discover digit count rules & shortcuts</p>
</div>
<div class="sim-card" id="sim"></div>
<div class="insight-box">
  <div class="insight-title">The Digit Count Rule</div>
  The product of an <strong>m-digit</strong> number and an <strong>n-digit</strong> number always has exactly <strong>(m+n-1)</strong> or <strong>(m+n)</strong> digits.
  <div class="rule-highlight">m-digit × n-digit = (m+n−1) or (m+n) digits</div>
</div>
</div>
<script>
function fmtI(n){if(n===0)return"0";let s=n.toString();if(s.length<=3)return s;let l=s.slice(-3),r=s.slice(0,-3),p=[];while(r.length>2){p.unshift(r.slice(-2));r=r.slice(0,-2)}if(r.length)p.unshift(r);return p.join(",")+","+l}
function dLen(n){return n.toString().length}

const c=document.getElementById("sim");
let expMode="multiply",numA=111,numB=111;

function renderMultiply(){
  const prod=numA*numB;const da=dLen(numA),db=dLen(numB),dp=dLen(prod);
  const rMin=da+db-1,rMax=da+db,ok=(dp===rMin||dp===rMax);

  c.innerHTML=`
  <div class="mode-tabs">
    <button class="mode-tab active" data-m="multiply">Multiply</button>
    <button class="mode-tab" data-m="patterns">Patterns</button>
    <button class="mode-tab" data-m="shortcuts">Shortcuts</button>
    <button class="mode-tab" data-m="grid">Digit Grid</button>
  </div>
  <div class="factor-row">
    <div class="factor-block a">${fmtI(numA)}<div class="fd">${da}-digit</div></div>
    <span class="factor-x">×</span>
    <div class="factor-block b">${fmtI(numB)}<div class="fd">${db}-digit</div></div>
  </div>
  <div class="result-panel">
    <div class="result-label">Product</div>
    <div class="result-value">${fmtI(prod)}</div>
    <div class="result-sub">${dp}-digit number</div>
  </div>
  <div style="text-align:center">
    <div class="rule-badge ${ok?"pass":"fail"}">Rule: ${da}+${db}−1=${rMin} or ${da}+${db}=${rMax} digits → Product has ${dp} digits ${ok?"✓":"✗"}</div>
  </div>
  <div class="slider-group" style="margin-top:12px">
    <div class="slider-label"><span class="name">Number A</span><span class="val">${fmtI(numA)}</span></div>
    <input type="range" data-k="a" min="1" max="99999" step="1" value="${numA}">
  </div>
  <div class="slider-group">
    <div class="slider-label"><span class="name">Number B</span><span class="val">${fmtI(numB)}</span></div>
    <input type="range" data-k="b" min="1" max="99999" step="1" value="${numB}">
  </div>
  <div class="presets">
    <button class="preset-btn" data-a="11" data-b="11">11×11</button>
    <button class="preset-btn" data-a="111" data-b="111">111×111</button>
    <button class="preset-btn" data-a="1111" data-b="1111">1111×1111</button>
    <button class="preset-btn" data-a="66" data-b="61">66×61</button>
    <button class="preset-btn" data-a="333" data-b="335">333×335</button>
    <button class="preset-btn" data-a="99" data-b="99">99×99</button>
    <button class="preset-btn" data-a="10" data-b="10">10×10</button>
  </div>`;
  wireAll();
}

function renderPatterns(){
  const PATS=[
    {title:"Palindrome",rows:[[11,11],[111,111],[1111,1111],[11111,11111]]},
    {title:"66 × 61",rows:[[66,61],[666,661],[6666,6661]]},
    {title:"3 × 5",rows:[[3,5],[33,35],[333,335],[3333,3335]]},
    {title:"101, 102, 103...",rows:[[101,101],[102,102],[103,103],[104,104]]}
  ];
  let tablesHtml=PATS.map(pat=>{
    let rows=pat.rows.map(([a,b])=>{const p=a*b,da=dLen(a),db=dLen(b),dp=dLen(p);return`<tr><td>${fmtI(a)}</td><td>${fmtI(b)}</td><td class="prod">${fmtI(p)}</td><td>${da}+${db}=${da+db}</td><td class="hl">${dp}</td></tr>`}).join("");
    return`<div class="card-title">${pat.title}</div><table class="ptable"><tr><th>A</th><th>B</th><th>A×B</th><th>m+n</th><th>Digits</th></tr>${rows}</table>`;
  }).join("");

  c.innerHTML=`
  <div class="mode-tabs">
    <button class="mode-tab" data-m="multiply">Multiply</button>
    <button class="mode-tab active" data-m="patterns">Patterns</button>
    <button class="mode-tab" data-m="shortcuts">Shortcuts</button>
    <button class="mode-tab" data-m="grid">Digit Grid</button>
  </div>
  ${tablesHtml}`;
  wireAll();
}

function renderShortcuts(){
  const scs=[
    {t:"Multiply by 5",r:"÷ 2, then × 10",ex:"116 × 5 = 116÷2 × 10 = 58 × 10 = 580"},
    {t:"Multiply by 25",r:"÷ 4, then × 100",ex:"824 × 25 = 824÷4 × 100 = 206 × 100 = 20,600"},
    {t:"Multiply by 125",r:"÷ 8, then × 1000",ex:"72 × 125 = 72÷8 × 1000 = 9 × 1000 = 9,000"},
    {t:"Smart Regrouping",r:"Pair factors to make round numbers",ex:"2 × 1768 × 50 = (2×50) × 1768 = 100 × 1768 = 1,76,800\n125 × 40 × 8 × 25 = (125×8) × (40×25) = 1000 × 1000 = 10,00,000"}
  ];
  c.innerHTML=`
  <div class="mode-tabs">
    <button class="mode-tab" data-m="multiply">Multiply</button>
    <button class="mode-tab" data-m="patterns">Patterns</button>
    <button class="mode-tab active" data-m="shortcuts">Shortcuts</button>
    <button class="mode-tab" data-m="grid">Digit Grid</button>
  </div>
  <div class="card-title">Multiplication Shortcuts</div>
  ${scs.map(s=>`<div class="sc-card"><div class="sc-title">${s.t}</div><div class="sc-rule">Rule: ${s.r}</div><div class="sc-ex" style="white-space:pre-line">${s.ex}</div></div>`).join("")}`;
  wireAll();
}

function renderGrid(){
  let gridHtml=`<div class="dg-cell dg-header"></div>`;
  for(let a=1;a<=5;a++) gridHtml+=`<div class="dg-cell dg-header">${a}d</div>`;
  for(let b=1;b<=5;b++){
    gridHtml+=`<div class="dg-cell dg-header">${b}d</div>`;
    for(let a=1;a<=5;a++){
      const mn=a+b-1,mx=a+b;
      const hl=(a===dLen(numA)&&b===dLen(numB))?" dg-highlight":"";
      gridHtml+=`<div class="dg-cell dg-body${hl}">${mn} or ${mx}</div>`;
    }
  }

  c.innerHTML=`
  <div class="mode-tabs">
    <button class="mode-tab" data-m="multiply">Multiply</button>
    <button class="mode-tab" data-m="patterns">Patterns</button>
    <button class="mode-tab" data-m="shortcuts">Shortcuts</button>
    <button class="mode-tab active" data-m="grid">Digit Grid</button>
  </div>
  <div class="card-title">Product Digit Count Grid</div>
  <div style="text-align:center;font-size:10px;color:#888;margin-bottom:6px">Columns = digits of A, Rows = digits of B</div>
  <div class="dg-grid">${gridHtml}</div>
  <div style="text-align:center;font-size:11px;color:#555;margin-top:8px">${fmtI(numA)} (${dLen(numA)}d) × ${fmtI(numB)} (${dLen(numB)}d) = ${fmtI(numA*numB)} (${dLen(numA*numB)}d)</div>
  <div class="slider-group" style="margin-top:10px">
    <div class="slider-label"><span class="name">Number A</span><span class="val">${fmtI(numA)}</span></div>
    <input type="range" data-k="a" min="1" max="99999" step="1" value="${numA}">
  </div>
  <div class="slider-group">
    <div class="slider-label"><span class="name">Number B</span><span class="val">${fmtI(numB)}</span></div>
    <input type="range" data-k="b" min="1" max="99999" step="1" value="${numB}">
  </div>`;
  wireAll();
}

function wireAll(){
  c.querySelectorAll(".mode-tab").forEach(b=>b.onclick=()=>{
    expMode=b.dataset.m;
    if(expMode==="multiply")renderMultiply();
    else if(expMode==="patterns")renderPatterns();
    else if(expMode==="shortcuts")renderShortcuts();
    else renderGrid();
  });
  c.querySelectorAll("input[type='range']").forEach(sl=>{sl.oninput=function(){
    if(this.dataset.k==="a")numA=parseInt(this.value);
    else numB=parseInt(this.value);
    if(expMode==="multiply")renderMultiply();else renderGrid();
  }});
  c.querySelectorAll(".preset-btn").forEach(b=>b.onclick=()=>{
    numA=parseInt(b.dataset.a);numB=parseInt(b.dataset.b);renderMultiply();
  });
}

renderMultiply();
</script>
</body>
</html>
