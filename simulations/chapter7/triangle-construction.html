<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Triangle Construction (SSS)</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 420px;
  margin: auto;
  padding: 10px;
  padding-top: max(10px, env(safe-area-inset-top));
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}

.header {
  text-align: center;
  color: #fff;
  padding: 12px;
}

.header h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.header p { font-size: 12px; opacity: 0.95; }

.sim-card {
  background: #fff;
  border-radius: 14px;
  padding: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  margin-bottom: 12px;
}

.visual {
  position: relative;
  height: 38vh;
  min-height: 260px;
  background: linear-gradient(145deg, #f5f3ff 0%, #ede9fe 100%);
  border-radius: 12px;
  overflow: hidden;
}

svg { width: 100%; height: 100%; display: block; }

.validity-badge {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 16px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  z-index: 10;
}

.validity-badge.valid { background: #d5f4e6; color: #1e8449; }
.validity-badge.invalid { background: #fce4ec; color: #c62828; }

.controls {
  background: #f5f3ff;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
}

.slider-group {
  margin-bottom: 10px;
}

.slider-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 4px;
}

.slider-label .name { color: #555; }
.slider-label .value { font-weight: 700; }
.slider-label .value.ab { color: #e74c3c; }
.slider-label .value.ac { color: #3498db; }
.slider-label .value.bc { color: #27ae60; }

input[type="range"] {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: #e0e0e0;
  -webkit-appearance: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #6366f1;
  border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.step-indicator {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
}

.step-dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  color: white;
  background: #c4b5fd;
  transition: all 0.3s;
}

.step-dot.active {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  transform: scale(1.15);
}

.step-dot.completed { background: #27ae60; }

.step-content {
  background: #f5f3ff;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
  min-height: 70px;
}

.step-content h3 { font-size: 13px; color: #333; margin-bottom: 6px; }
.step-content p { font-size: 11px; color: #555; line-height: 1.5; }

.nav-buttons {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.nav-btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
}

.nav-btn.prev { background: #ede9fe; color: #666; }
.nav-btn.next { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
.nav-btn:disabled { opacity: 0.4; }
.nav-btn:active { transform: scale(0.98); }

.angles-display {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  padding: 10px;
  background: white;
  border-radius: 8px;
}

.angle-item {
  flex: 1;
  text-align: center;
  font-size: 11px;
}

.angle-item .label { color: #666; }
.angle-item .value { font-weight: 700; color: #6366f1; }

.insight-box {
  background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
  border-radius: 10px;
  padding: 12px;
  margin-top: 12px;
  font-size: 11px;
  line-height: 1.5;
  border-left: 4px solid #6366f1;
}

.insight-title { font-weight: 600; color: #6366f1; margin-bottom: 6px; }

.type-tags {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  justify-content: center;
}

.type-tag {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
}

.type-tag.equilateral { background: #d5f4e6; color: #1e8449; }
.type-tag.isosceles { background: #d4e8f7; color: #2980b9; }
.type-tag.scalene { background: #f5f3ff; color: #6366f1; }
</style>
</head>

<body>
<div id="app">

<div class="header">
  <h1>📐 Triangle Construction (SSS)</h1>
  <p>Build a triangle from 3 side lengths</p>
</div>

<div class="sim-card" id="sim"></div>

<div class="insight-box">
  <div class="insight-title">📖 SSS Construction Method</div>
  When all three sides are given, we use <strong>compass arcs</strong> to find the third vertex. The intersection of arcs from A and B gives us point C.
</div>

</div>

<script>
const container = document.getElementById('sim');
let ab = 6, ac = 5, bc = 4;
let currentStep = 1;
let animProgress = 0;
let animId = null;

const scale = 28;
const originX = 100, originY = 200;

function isValid() {
  return (ab + ac > bc) && (ac + bc > ab) && (ab + bc > ac);
}

function getType() {
  const eps = 0.01;
  if (Math.abs(ab - ac) < eps && Math.abs(ac - bc) < eps) return 'equilateral';
  if (Math.abs(ab - ac) < eps || Math.abs(ac - bc) < eps || Math.abs(ab - bc) < eps) return 'isosceles';
  return 'scalene';
}

function calcC() {
  if (!isValid()) return null;
  const x = (ab * ab + ac * ac - bc * bc) / (2 * ab);
  const y2 = ac * ac - x * x;
  if (y2 < 0) return null;
  return { x: originX + x * scale, y: originY - Math.sqrt(y2) * scale };
}

function calcAngles() {
  if (!isValid()) return null;
  const angA = Math.acos((ac*ac + ab*ab - bc*bc) / (2*ac*ab)) * 180 / Math.PI;
  const angB = Math.acos((ab*ab + bc*bc - ac*ac) / (2*ab*bc)) * 180 / Math.PI;
  const angC = 180 - angA - angB;
  return { a: angA, b: angB, c: angC };
}

const steps = [
  { title: "Step 1: Draw Base AB", desc: "Draw line segment AB of the given length." },
  { title: "Step 2: Arc from A", desc: "Draw an arc of radius AC centered at A." },
  { title: "Step 3: Arc from B", desc: "Draw an arc of radius BC centered at B. They intersect at C!" },
  { title: "Step 4: Complete Triangle", desc: "Join A to C and B to C. Triangle complete!" }
];

function render() {
  const valid = isValid();
  const type = getType();
  const A = { x: originX, y: originY };
  const B = { x: originX + ab * scale, y: originY };
  const C = calcC();
  const angles = calcAngles();
  
  let typeTag = '';
  if (valid) {
    if (type === 'equilateral') typeTag = '<span class="type-tag equilateral">Equilateral</span>';
    else if (type === 'isosceles') typeTag = '<span class="type-tag isosceles">Isosceles</span>';
    else typeTag = '<span class="type-tag scalene">Scalene</span>';
  }
  
  container.innerHTML = `
<div class="visual">
  <div class="validity-badge ${valid ? 'valid' : 'invalid'}">
    ${valid ? '✓ Triangle possible!' : '✗ Cannot form triangle'}
  </div>
  <svg viewBox="0 0 400 260" id="svg"></svg>
</div>

<div class="controls">
  <div class="slider-group">
    <div class="slider-label"><span class="name">Side AB (base)</span><span class="value ab">${ab} cm</span></div>
    <input type="range" id="sliderAB" min="2" max="10" step="0.5" value="${ab}">
  </div>
  <div class="slider-group">
    <div class="slider-label"><span class="name">Side AC</span><span class="value ac">${ac} cm</span></div>
    <input type="range" id="sliderAC" min="2" max="10" step="0.5" value="${ac}">
  </div>
  <div class="slider-group">
    <div class="slider-label"><span class="name">Side BC</span><span class="value bc">${bc} cm</span></div>
    <input type="range" id="sliderBC" min="2" max="10" step="0.5" value="${bc}">
  </div>
  ${valid ? `<div class="type-tags">${typeTag}</div>` : ''}
</div>

<div class="step-indicator">
  <div class="step-dot ${currentStep >= 1 ? (currentStep > 1 ? 'completed' : 'active') : ''}">1</div>
  <div class="step-dot ${currentStep >= 2 ? (currentStep > 2 ? 'completed' : 'active') : ''}">2</div>
  <div class="step-dot ${currentStep >= 3 ? (currentStep > 3 ? 'completed' : 'active') : ''}">3</div>
  <div class="step-dot ${currentStep >= 4 ? 'active' : ''}">4</div>
</div>

<div class="step-content">
  <h3>${steps[currentStep - 1].title}</h3>
  <p>${steps[currentStep - 1].desc}</p>
</div>

<div class="nav-buttons">
  <button class="nav-btn prev" id="prevBtn" ${currentStep === 1 ? 'disabled' : ''}>← Back</button>
  <button class="nav-btn next" id="nextBtn">${currentStep === 4 ? '✓ Done' : 'Next →'}</button>
</div>

${valid && currentStep === 4 && angles ? `
<div class="angles-display">
  <div class="angle-item"><div class="label">∠A</div><div class="value">${angles.a.toFixed(1)}°</div></div>
  <div class="angle-item"><div class="label">∠B</div><div class="value">${angles.b.toFixed(1)}°</div></div>
  <div class="angle-item"><div class="label">∠C</div><div class="value">${angles.c.toFixed(1)}°</div></div>
  <div class="angle-item"><div class="label">Sum</div><div class="value">${(angles.a + angles.b + angles.c).toFixed(0)}°</div></div>
</div>
` : ''}`;

  // Draw SVG
  const svg = document.getElementById('svg');
  let svgContent = '';
  
  // Grid
  for (let i = 0; i < 400; i += 20) {
    svgContent += `<line x1="${i}" y1="0" x2="${i}" y2="260" stroke="rgba(0,0,0,0.04)"/>`;
  }
  for (let i = 0; i < 260; i += 20) {
    svgContent += `<line x1="0" y1="${i}" x2="400" y2="${i}" stroke="rgba(0,0,0,0.04)"/>`;
  }
  
  // Step 1: Base AB
  if (currentStep >= 1) {
    const p = currentStep === 1 ? animProgress : 1;
    svgContent += `<line x1="${A.x}" y1="${A.y}" x2="${A.x + (B.x - A.x) * p}" y2="${A.y}" stroke="#2c3e50" stroke-width="3"/>`;
    if (p > 0.2) {
      svgContent += `<circle cx="${A.x}" cy="${A.y}" r="5" fill="#e74c3c"/>`;
      svgContent += `<text x="${A.x - 15}" y="${A.y + 20}" font-size="14" fill="#e74c3c" font-weight="600">A</text>`;
    }
    if (p > 0.9) {
      svgContent += `<circle cx="${B.x}" cy="${B.y}" r="5" fill="#e74c3c"/>`;
      svgContent += `<text x="${B.x + 5}" y="${B.y + 20}" font-size="14" fill="#e74c3c" font-weight="600">B</text>`;
      svgContent += `<text x="${(A.x + B.x) / 2}" y="${A.y + 35}" font-size="11" fill="#2c3e50" text-anchor="middle">${ab} cm</text>`;
    }
  }
  
  // Step 2: Arc from A
  if (currentStep >= 2 && valid) {
    const p = currentStep === 2 ? animProgress : 1;
    const r = ac * scale;
    svgContent += `<path d="M ${A.x + r} ${A.y} A ${r} ${r} 0 0 0 ${A.x - r * Math.cos(Math.PI * p)} ${A.y - r * Math.sin(Math.PI * p)}" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3"/>`;
    if (p > 0.5) {
      svgContent += `<text x="${A.x - 30}" y="${A.y - r - 8}" font-size="10" fill="#3498db">radius = ${ac} cm</text>`;
    }
  }
  
  // Step 3: Arc from B
  if (currentStep >= 3 && valid) {
    const p = currentStep === 3 ? animProgress : 1;
    const r = bc * scale;
    svgContent += `<path d="M ${B.x - r} ${B.y} A ${r} ${r} 0 0 1 ${B.x - r + r * (1 - Math.cos(Math.PI * p))} ${B.y - r * Math.sin(Math.PI * p)}" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3"/>`;
    if (p > 0.5) {
      svgContent += `<text x="${B.x + 10}" y="${B.y - r - 8}" font-size="10" fill="#27ae60">radius = ${bc} cm</text>`;
    }
    if (C && p > 0.8) {
      svgContent += `<circle cx="${C.x}" cy="${C.y}" r="8" fill="#f39c12" stroke="white" stroke-width="2"/>`;
      svgContent += `<text x="${C.x + 12}" y="${C.y - 5}" font-size="14" fill="#f39c12" font-weight="600">C</text>`;
    }
  }
  
  // Step 4: Complete triangle
  if (currentStep >= 4 && valid && C) {
    const p = currentStep === 4 ? animProgress : 1;
    
    // AC
    svgContent += `<line x1="${A.x}" y1="${A.y}" x2="${A.x + (C.x - A.x) * p}" y2="${A.y + (C.y - A.y) * p}" stroke="#8e44ad" stroke-width="3"/>`;
    
    // BC
    if (p > 0.5) {
      const p2 = (p - 0.5) * 2;
      svgContent += `<line x1="${B.x}" y1="${B.y}" x2="${B.x + (C.x - B.x) * p2}" y2="${B.y + (C.y - B.y) * p2}" stroke="#8e44ad" stroke-width="3"/>`;
    }
    
    if (p > 0.9) {
      svgContent += `<polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" fill="rgba(142,68,173,0.1)" stroke="none"/>`;
      svgContent += `<text x="200" y="35" font-size="16" fill="#27ae60" font-weight="700" text-anchor="middle">✓ Triangle Complete!</text>`;
    }
    
    svgContent += `<circle cx="${C.x}" cy="${C.y}" r="6" fill="#f39c12"/>`;
  }
  
  // Invalid message
  if (!valid && currentStep > 1) {
    svgContent += `<text x="200" y="80" font-size="14" fill="#e74c3c" font-weight="600" text-anchor="middle">Arcs don't intersect!</text>`;
    svgContent += `<text x="200" y="100" font-size="11" fill="#666" text-anchor="middle">Adjust side lengths</text>`;
  }
  
  svg.innerHTML = svgContent;
  
  // Event handlers
  document.getElementById('sliderAB').oninput = (e) => { ab = parseFloat(e.target.value); render(); };
  document.getElementById('sliderAC').oninput = (e) => { ac = parseFloat(e.target.value); render(); };
  document.getElementById('sliderBC').oninput = (e) => { bc = parseFloat(e.target.value); render(); };
  
  document.getElementById('prevBtn').onclick = () => {
    if (currentStep > 1) { currentStep--; startAnim(); }
  };
  
  document.getElementById('nextBtn').onclick = () => {
    if (currentStep < 4) { currentStep++; startAnim(); }
  };
}

function animate() {
  if (animProgress < 1) {
    animProgress += 0.03;
    if (animProgress > 1) animProgress = 1;
    render();
    animId = requestAnimationFrame(animate);
  }
}

function startAnim() {
  if (animId) cancelAnimationFrame(animId);
  animProgress = 0;
  animate();
}

startAnim();
</script>
</body>
</html>
