<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Angle Sum Property</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
  touch-action: manipulation;
}

#app {
  max-width: 420px;
  margin: auto;
  padding: 10px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  margin: 8px 4px;
  color: #444;
}

.sim-card {
  background: #fff;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}

.visual {
  position: relative;
  height: 40vh;
  min-height: 270px;
  background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
  border-radius: 12px;
  overflow: hidden;
  touch-action: none;
}

svg { width: 100%; height: 100%; }

.static-hint {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(255,255,255,0.95);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 11px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
  color: #667eea;
  font-weight: 500;
}

.sum-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  text-align: center;
}

.sum-badge .label { font-size: 10px; opacity: 0.9; }
.sum-badge .value { font-size: 20px; font-weight: 700; }

.metrics {
  position: absolute;
  left: 8px;
  bottom: 8px;
  background: rgba(255,255,255,0.96);
  border-radius: 10px;
  padding: 10px;
  font-size: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
  display: flex;
  gap: 8px;
}

.angle-box {
  padding: 6px 10px;
  border-radius: 6px;
  font-weight: 700;
  text-align: center;
}

.angle-box.a { background: #e74c3c20; color: #c0392b; }
.angle-box.b { background: #3498db20; color: #2980b9; }
.angle-box.c { background: #27ae6020; color: #27ae60; }

.concept-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}

.concept-card h3 {
  font-size: 14px;
  color: #333;
  margin-bottom: 8px;
}

.concept-card p {
  font-size: 12px;
  color: #666;
  line-height: 1.5;
}

.concept-card .highlight {
  background: #667eea20;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
  text-align: center;
}

.concept-card .highlight strong {
  color: #667eea;
  font-size: 18px;
}

/* SVG */
.triangle-edge { stroke: #333; stroke-width: 3; fill: none; }
.triangle-fill { fill: #667eea10; }
.angle-arc { stroke-width: 2; fill-opacity: 0.3; }
.arc-a { fill: #e74c3c; stroke: #e74c3c; }
.arc-b { fill: #3498db; stroke: #3498db; }
.arc-c { fill: #27ae60; stroke: #27ae60; }
.drag-point { fill: white; stroke: #333; stroke-width: 2; cursor: grab; }
.vertex-label { font-size: 14px; font-weight: 600; }
</style>
</head>

<body>
<div id="app">
  <div class="section-title">Reference (equilateral 60°-60°-60°)</div>
  <div class="sim-card" id="ref"></div>
  
  <div class="section-title">Experiment (drag vertex C)</div>
  <div class="sim-card" id="exp"></div>
  
  <div class="concept-card">
    <h3>Angle Sum Property</h3>
    <p>Drag point C anywhere. Watch the three angles.</p>
    <p style="margin-top:8px;">No matter how you change the triangle shape...</p>
    <div class="highlight">
      <strong>∠A + ∠B + ∠C = 180°</strong>
      <p style="margin-top:6px;font-size:11px;color:#666;">Always! This is true for ALL triangles.</p>
    </div>
  </div>
</div>

<script>
function createSimulation(containerId, isInteractive) {
  const c = document.getElementById(containerId);
  
  // Vertex positions (in SVG coordinates)
  let A = {x: 200, y: 50};
  let B = {x: 80, y: 220};
  let C = {x: 320, y: 220};
  
  if (!isInteractive) {
    // Equilateral for reference
    A = {x: 200, y: 60};
    B = {x: 100, y: 220};
    C = {x: 300, y: 220};
  }
  
  function calcAngles() {
    const ab = Math.sqrt((B.x-A.x)**2 + (B.y-A.y)**2);
    const bc = Math.sqrt((C.x-B.x)**2 + (C.y-B.y)**2);
    const ca = Math.sqrt((A.x-C.x)**2 + (A.y-C.y)**2);
    
    const angA = Math.acos((ab*ab + ca*ca - bc*bc) / (2*ab*ca)) * 180 / Math.PI;
    const angB = Math.acos((ab*ab + bc*bc - ca*ca) / (2*ab*bc)) * 180 / Math.PI;
    const angC = 180 - angA - angB;
    
    return {a: angA, b: angB, c: angC};
  }
  
  function getMetricsHtml() {
    const ang = calcAngles();
    return `
      <div class="angle-box a">∠A<br>${ang.a.toFixed(1)}°</div>
      <div class="angle-box b">∠B<br>${ang.b.toFixed(1)}°</div>
      <div class="angle-box c">∠C<br>${ang.c.toFixed(1)}°</div>
    `;
  }
  
  function getSumHtml() {
    const ang = calcAngles();
    return `
      <div class="label">∠A + ∠B + ∠C</div>
      <div class="value">${(ang.a + ang.b + ang.c).toFixed(1)}°</div>
    `;
  }

  c.innerHTML = `
  <div class="visual">
    ${isInteractive ? '<div class="static-hint">Drag point C</div>' : ''}
    <div class="sum-badge" id="sumBadge">${getSumHtml()}</div>
    
    <svg viewBox="0 0 400 280" id="svg_${containerId}"></svg>
    
    <div class="metrics" id="metricsBox">${getMetricsHtml()}</div>
  </div>`;

  const svg = c.querySelector('svg');
  
  function toRad(d) { return d * Math.PI / 180; }
  
  function arcPath(vertex, p1, p2, radius) {
    const angle1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
    const angle2 = Math.atan2(p2.y - vertex.y, p2.x - vertex.x);
    
    let start = angle1, end = angle2;
    let diff = end - start;
    if (diff > Math.PI) start += 2 * Math.PI;
    if (diff < -Math.PI) end += 2 * Math.PI;
    if (start > end) [start, end] = [end, start];
    
    const x1 = vertex.x + radius * Math.cos(start);
    const y1 = vertex.y + radius * Math.sin(start);
    const x2 = vertex.x + radius * Math.cos(end);
    const y2 = vertex.y + radius * Math.sin(end);
    
    const largeArc = (end - start) > Math.PI ? 1 : 0;
    return `M ${vertex.x} ${vertex.y} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
  }
  
  function render() {
    const ang = calcAngles();
    
    c.querySelector('#metricsBox').innerHTML = getMetricsHtml();
    c.querySelector('#sumBadge').innerHTML = getSumHtml();
    
    const arcR = 25;
    
    svg.innerHTML = `
      <!-- Triangle fill -->
      <polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" class="triangle-fill"/>
      
      <!-- Angle arcs -->
      <path d="${arcPath(A, B, C, arcR)}" class="angle-arc arc-a"/>
      <path d="${arcPath(B, A, C, arcR)}" class="angle-arc arc-b"/>
      <path d="${arcPath(C, A, B, arcR)}" class="angle-arc arc-c"/>
      
      <!-- Triangle edges -->
      <polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" class="triangle-edge"/>
      
      <!-- Vertex labels -->
      <text x="${A.x}" y="${A.y - 15}" class="vertex-label" fill="#c0392b" text-anchor="middle">A</text>
      <text x="${B.x - 15}" y="${B.y + 5}" class="vertex-label" fill="#2980b9" text-anchor="middle">B</text>
      <text x="${C.x + 15}" y="${C.y + 5}" class="vertex-label" fill="#27ae60" text-anchor="middle">C</text>
      
      <!-- Vertices -->
      <circle cx="${A.x}" cy="${A.y}" r="8" fill="#e74c3c" stroke="white" stroke-width="2"/>
      <circle cx="${B.x}" cy="${B.y}" r="8" fill="#3498db" stroke="white" stroke-width="2"/>
      ${isInteractive ? 
        `<circle cx="${C.x}" cy="${C.y}" r="14" class="drag-point" id="dragC"/>` :
        `<circle cx="${C.x}" cy="${C.y}" r="8" fill="#27ae60" stroke="white" stroke-width="2"/>`
      }
    `;
  }
  
  render();
  
  if (isInteractive) {
    let dragging = false;
    
    function updateC(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      C.x = Math.max(50, Math.min(350, (clientX - rect.left) / rect.width * 400));
      C.y = Math.max(30, Math.min(260, (clientY - rect.top) / rect.height * 280));
      render();
    }
    
    svg.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const handle = c.querySelector('#dragC');
      if (!handle) return;
      const rect = handle.getBoundingClientRect();
      if (Math.hypot(touch.clientX - rect.left - 14, touch.clientY - rect.top - 14) < 50) {
        dragging = true;
        c.querySelector('.static-hint')?.remove();
      }
    });
    
    svg.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      updateC(e.touches[0].clientX, e.touches[0].clientY);
    });
    
    svg.addEventListener('touchend', () => { dragging = false; });
    
    svg.addEventListener('mousedown', (e) => {
      if (e.target.id === 'dragC') {
        dragging = true;
        c.querySelector('.static-hint')?.remove();
      }
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      updateC(e.clientX, e.clientY);
    });
    
    document.addEventListener('mouseup', () => { dragging = false; });
  }
}

createSimulation('ref', false);
createSimulation('exp', true);
</script>
</body>
</html>
