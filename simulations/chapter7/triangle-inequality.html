<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Triangle Inequality</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
  touch-action: manipulation;
}

#app {
  max-width: 420px;
  margin: auto;
  padding: 10px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  margin: 8px 4px;
  color: #444;
}

.sim-card {
  background: #fff;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}

.visual {
  position: relative;
  height: 36vh;
  min-height: 240px;
  background: linear-gradient(135deg, #ff758c15 0%, #ff7eb315 100%);
  border-radius: 12px;
  overflow: hidden;
  touch-action: none;
}

svg { width: 100%; height: 100%; }

.status-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
}

.status-badge.yes {
  background: #27ae60;
  color: white;
}

.status-badge.no {
  background: #e74c3c;
  color: white;
}

.metrics {
  position: absolute;
  right: 8px;
  bottom: 8px;
  background: rgba(255,255,255,0.96);
  border-radius: 10px;
  padding: 10px;
  font-size: 11px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
}

.metrics .check {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  gap: 10px;
}

.metrics .expr { font-family: monospace; font-weight: 600; }
.metrics .pass { color: #27ae60; }
.metrics .fail { color: #e74c3c; }
.metrics .icon { font-size: 14px; }

.control-toggle {
  position: absolute;
  right: 8px;
  top: 8px;
  background: #ff758c;
  color: #fff;
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.control-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.98);
  border-top: 1px solid #ddd;
  border-radius: 16px 16px 0 0;
  padding: 16px;
  transform: translateY(100%);
  transition: transform .25s ease;
}

.control-overlay.open { transform: translateY(0); }

.control-group {
  margin-bottom: 14px;
}

.control-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
  color: #333;
}

.control-label span:last-child {
  font-weight: 700;
  color: #ff758c;
}

.control-group input[type="range"] {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: #e0e0e0;
  -webkit-appearance: none;
}

.control-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #ff758c;
  border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.presets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.preset-btn {
  padding: 6px 10px;
  border-radius: 16px;
  border: 2px solid #ddd;
  background: white;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.preset-btn.valid { border-color: #27ae60; color: #27ae60; }
.preset-btn.invalid { border-color: #e74c3c; color: #e74c3c; }

.submit-btn {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #ff758c;
  color: white;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

.concept-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}

.concept-card h3 {
  font-size: 14px;
  color: #333;
  margin-bottom: 8px;
}

.concept-card p {
  font-size: 12px;
  color: #666;
  line-height: 1.5;
}

.concept-card .rule {
  background: #ff758c15;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
  text-align: center;
}

.concept-card .rule strong { color: #ff758c; font-size: 14px; }

/* SVG */
.stick { stroke-linecap: round; stroke-width: 8; }
.stick-a { stroke: #e74c3c; }
.stick-b { stroke: #3498db; }
.stick-c { stroke: #27ae60; }
.triangle-fill { fill: #27ae6020; stroke: none; }
</style>
</head>

<body>
<div id="app">
  <div class="section-title">Reference (3, 4, 5 - valid)</div>
  <div class="sim-card" id="ref"></div>
  
  <div class="section-title">Experiment (adjust sides)</div>
  <div class="sim-card" id="exp"></div>
  
  <div class="concept-card">
    <h3>The Triangle Inequality Rule</h3>
    <p>For 3 sticks to form a triangle, each stick must be <b>shorter</b> than the sum of the other two.</p>
    <div class="rule">
      <strong>a + b > c</strong> &nbsp;AND&nbsp; <strong>b + c > a</strong> &nbsp;AND&nbsp; <strong>a + c > b</strong>
    </div>
    <p style="margin-top:10px;">Try making one side very long. What happens?</p>
  </div>
</div>

<script>
function createSimulation(containerId, isInteractive, initA, initB, initC) {
  const c = document.getElementById(containerId);
  let a = initA, b = initB, sideC = initC;
  
  function isValid() {
    return (a + b > sideC) && (b + sideC > a) && (a + sideC > b);
  }
  
  function getMetricsHtml() {
    const c1 = a + b > sideC;
    const c2 = b + sideC > a;
    const c3 = a + sideC > b;
    return `
      <div class="check">
        <span class="expr ${c1?'pass':'fail'}">${a}+${b}=${a+b} ${c1?'>':'≤'} ${sideC}</span>
        <span class="icon">${c1?'✓':'✗'}</span>
      </div>
      <div class="check">
        <span class="expr ${c2?'pass':'fail'}">${b}+${sideC}=${b+sideC} ${c2?'>':'≤'} ${a}</span>
        <span class="icon">${c2?'✓':'✗'}</span>
      </div>
      <div class="check">
        <span class="expr ${c3?'pass':'fail'}">${a}+${sideC}=${a+sideC} ${c3?'>':'≤'} ${b}</span>
        <span class="icon">${c3?'✓':'✗'}</span>
      </div>
    `;
  }

  const controlsHtml = `
    <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:#666;">Try these:</div>
    <div class="presets">
      <button class="preset-btn valid" data-a="3" data-b="4" data-c="5">3,4,5</button>
      <button class="preset-btn valid" data-a="5" data-b="5" data-c="5">5,5,5</button>
      <button class="preset-btn invalid" data-a="1" data-b="2" data-c="5">1,2,5</button>
      <button class="preset-btn invalid" data-a="3" data-b="4" data-c="8">3,4,8</button>
    </div>
    <div class="control-group">
      <div class="control-label"><span>Side a (red)</span><span id="val_a">${a}</span></div>
      <input type="range" id="slider_a" min="1" max="10" value="${a}">
    </div>
    <div class="control-group">
      <div class="control-label"><span>Side b (blue)</span><span id="val_b">${b}</span></div>
      <input type="range" id="slider_b" min="1" max="10" value="${b}">
    </div>
    <div class="control-group">
      <div class="control-label"><span>Side c (green)</span><span id="val_c">${sideC}</span></div>
      <input type="range" id="slider_c" min="1" max="10" value="${sideC}">
    </div>
  `;

  c.innerHTML = `
  <div class="visual">
    <div class="status-badge ${isValid()?'yes':'no'}" id="statusBadge">
      ${isValid()?'✓ Triangle possible':'✗ Cannot form triangle'}
    </div>
    ${isInteractive ? '<button class="control-toggle">Adjust</button>' : ''}
    
    <svg viewBox="0 0 400 280" id="svg_${containerId}"></svg>
    
    <div class="metrics" id="metricsBox">${getMetricsHtml()}</div>
    
    ${isInteractive ? `
    <div class="control-overlay">
      ${controlsHtml}
      <button class="submit-btn">Apply Changes</button>
    </div>` : ''}
  </div>`;

  const svg = c.querySelector('svg');
  const scale = 22;
  const cx = 200, baseY = 200;
  
  function render() {
    const valid = isValid();
    
    // Update status
    const badge = c.querySelector('#statusBadge');
    badge.className = `status-badge ${valid ? 'yes' : 'no'}`;
    badge.textContent = valid ? '✓ Triangle possible' : '✗ Cannot form triangle';
    
    c.querySelector('#metricsBox').innerHTML = getMetricsHtml();
    
    if (valid) {
      // Calculate triangle vertices
      const A = {x: cx - sideC * scale / 2, y: baseY};
      const B = {x: cx + sideC * scale / 2, y: baseY};
      const x = (sideC * sideC + b * b - a * a) / (2 * sideC);
      const yVal = Math.sqrt(Math.max(0, b * b - x * x));
      const C = {x: A.x + x * scale, y: baseY - yVal * scale};
      
      svg.innerHTML = `
        <polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" class="triangle-fill"/>
        <line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" class="stick stick-c"/>
        <line x1="${B.x}" y1="${B.y}" x2="${C.x}" y2="${C.y}" class="stick stick-a"/>
        <line x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}" class="stick stick-b"/>
        <text x="${(A.x+B.x)/2}" y="${A.y+20}" font-size="12" fill="#27ae60" font-weight="600" text-anchor="middle">c=${sideC}</text>
        <text x="${(B.x+C.x)/2+15}" y="${(B.y+C.y)/2}" font-size="12" fill="#e74c3c" font-weight="600">a=${a}</text>
        <text x="${(A.x+C.x)/2-15}" y="${(A.y+C.y)/2}" font-size="12" fill="#3498db" font-weight="600">b=${b}</text>
        <text x="${cx}" y="40" font-size="16" fill="#27ae60" font-weight="700" text-anchor="middle">Triangle formed! ✓</text>
      `;
    } else {
      // Show sticks that can't connect
      const A = {x: cx - sideC * scale / 2, y: baseY};
      const B = {x: cx + sideC * scale / 2, y: baseY};
      const endB = {x: A.x + b * scale * 0.7, y: baseY - b * scale * 0.7};
      const endA = {x: B.x - a * scale * 0.7, y: baseY - a * scale * 0.7};
      
      svg.innerHTML = `
        <line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" class="stick stick-c"/>
        <line x1="${A.x}" y1="${A.y}" x2="${endB.x}" y2="${endB.y}" class="stick stick-b"/>
        <line x1="${B.x}" y1="${B.y}" x2="${endA.x}" y2="${endA.y}" class="stick stick-a"/>
        <line x1="${endB.x}" y1="${endB.y}" x2="${endA.x}" y2="${endA.y}" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
        <text x="${(endB.x+endA.x)/2}" y="${(endB.y+endA.y)/2-10}" font-size="11" fill="#e74c3c" font-weight="600" text-anchor="middle">Gap!</text>
        <text x="${(A.x+B.x)/2}" y="${A.y+20}" font-size="12" fill="#27ae60" font-weight="600" text-anchor="middle">c=${sideC}</text>
        <text x="${cx}" y="40" font-size="14" fill="#e74c3c" font-weight="700" text-anchor="middle">Sides cannot meet! ✗</text>
      `;
    }
  }
  
  render();
  
  if (isInteractive) {
    const toggleBtn = c.querySelector('.control-toggle');
    const overlay = c.querySelector('.control-overlay');
    const sliderA = c.querySelector('#slider_a');
    const sliderB = c.querySelector('#slider_b');
    const sliderC = c.querySelector('#slider_c');
    const valA = c.querySelector('#val_a');
    const valB = c.querySelector('#val_b');
    const valC = c.querySelector('#val_c');
    const submitBtn = c.querySelector('.submit-btn');
    const presetBtns = c.querySelectorAll('.preset-btn');
    
    toggleBtn.addEventListener('click', () => {
      overlay.classList.toggle('open');
      toggleBtn.textContent = overlay.classList.contains('open') ? 'Close' : 'Adjust';
    });
    
    sliderA.addEventListener('input', () => { valA.textContent = sliderA.value; });
    sliderB.addEventListener('input', () => { valB.textContent = sliderB.value; });
    sliderC.addEventListener('input', () => { valC.textContent = sliderC.value; });
    
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        sliderA.value = btn.dataset.a; valA.textContent = btn.dataset.a;
        sliderB.value = btn.dataset.b; valB.textContent = btn.dataset.b;
        sliderC.value = btn.dataset.c; valC.textContent = btn.dataset.c;
      });
    });
    
    submitBtn.addEventListener('click', () => {
      a = parseInt(sliderA.value);
      b = parseInt(sliderB.value);
      sideC = parseInt(sliderC.value);
      render();
      overlay.classList.remove('open');
      toggleBtn.textContent = 'Adjust';
    });
  }
}

createSimulation('ref', false, 3, 4, 5);
createSimulation('exp', true, 3, 4, 5);
</script>
</body>
</html>
