<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Intersecting Lines - Angles</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
  touch-action: manipulation;
}

#app {
  max-width: 420px;
  margin: auto;
  padding: 10px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  margin: 8px 4px;
  color: #444;
}

.sim-card {
  background: #fff;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}

.visual {
  position: relative;
  height: 38vh;
  min-height: 260px;
  background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
  border-radius: 12px;
  overflow: hidden;
  touch-action: none;
}

svg { width: 100%; height: 100%; }

.static-hint {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(255,255,255,0.95);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 11px;
  line-height: 1.3;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
  color: #667eea;
  font-weight: 500;
}

.metrics {
  position: absolute;
  left: 8px;
  bottom: 8px;
  background: rgba(255,255,255,0.96);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.5;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
}

.metrics .metric-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.metrics .label { color: #666; }
.metrics .value { font-weight: 700; }
.metrics .value.red { color: #e74c3c; }
.metrics .value.blue { color: #3498db; }

.control-toggle {
  position: absolute;
  right: 8px;
  top: 8px;
  background: #667eea;
  color: #fff;
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.control-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.98);
  border-top: 1px solid #ddd;
  border-radius: 16px 16px 0 0;
  padding: 16px;
  transform: translateY(100%);
  transition: transform .25s ease;
}

.control-overlay.open { transform: translateY(0); }

.control-group {
  margin-bottom: 12px;
}

.control-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
  color: #333;
}

.control-label span:last-child {
  font-weight: 700;
  color: #667eea;
}

.control-group input[type="range"] {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: #e0e0e0;
  -webkit-appearance: none;
}

.control-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #667eea;
  border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.submit-btn {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #667eea;
  color: white;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

.concept-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}

.concept-card h3 {
  font-size: 14px;
  color: #333;
  margin-bottom: 8px;
}

.concept-card p {
  font-size: 12px;
  color: #666;
  line-height: 1.5;
}

.concept-card .highlight {
  background: #667eea20;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
  color: #667eea;
}

/* SVG styles */
.line-m { stroke: #2c3e50; stroke-width: 3; }
.line-l { stroke: #8e44ad; stroke-width: 3; }
.angle-arc { fill-opacity: 0.2; stroke-width: 2; }
.angle-a { fill: #e74c3c; stroke: #e74c3c; }
.angle-b { fill: #3498db; stroke: #3498db; }
.intersection-point { fill: #333; }
.drag-handle { fill: #8e44ad; stroke: white; stroke-width: 2; cursor: grab; }
</style>
</head>

<body>
<div id="app">
  <div class="section-title">Reference (fixed at 60°)</div>
  <div class="sim-card" id="ref"></div>
  
  <div class="section-title">Experiment (drag or adjust)</div>
  <div class="sim-card" id="exp"></div>
  
  <div class="concept-card">
    <h3>What to notice</h3>
    <p>Drag the purple line in the experiment.</p>
    <p style="margin-top:8px;">Watch: <span class="highlight">∠a = ∠c</span> always (vertically opposite)</p>
    <p style="margin-top:4px;">Watch: <span class="highlight">∠a + ∠b = 180°</span> always (linear pair)</p>
  </div>
</div>

<script>
function createSimulation(containerId, isInteractive, initialAngle) {
  const c = document.getElementById(containerId);
  let angle = initialAngle;
  
  const metricsHtml = `
    <div class="metric-row">
      <span class="label">∠a, ∠c =</span>
      <span class="value red" id="angleAC">${angle.toFixed(1)}°</span>
    </div>
    <div class="metric-row">
      <span class="label">∠b, ∠d =</span>
      <span class="value blue" id="angleBD">${(180-angle).toFixed(1)}°</span>
    </div>
    <div class="metric-row" style="margin-top:6px; padding-top:6px; border-top:1px solid #eee;">
      <span class="label">∠a + ∠b =</span>
      <span class="value" id="sumAB">180.0°</span>
    </div>
  `;

  const controlsHtml = `
    <div class="control-group">
      <div class="control-label">
        <span>Angle ∠a</span>
        <span id="slider_val">${angle}°</span>
      </div>
      <input type="range" id="angleSlider" min="15" max="165" step="1" value="${angle}">
    </div>
  `;

  c.innerHTML = `
  <div class="visual">
    ${isInteractive ? '<div class="static-hint">Drag ↻ the purple endpoint</div>' : ''}
    ${isInteractive ? '<button class="control-toggle">Adjust</button>' : ''}
    
    <svg viewBox="0 0 400 300" id="svg_${containerId}"></svg>
    
    <div class="metrics">${metricsHtml}</div>
    
    ${isInteractive ? `
    <div class="control-overlay">
      ${controlsHtml}
      <button class="submit-btn">Apply Changes</button>
    </div>` : ''}
  </div>`;

  const svg = c.querySelector('svg');
  const cx = 200, cy = 150, lineLen = 120;
  
  function toRad(d) { return d * Math.PI / 180; }
  
  function render() {
    const angleAC = angle;
    const angleBD = 180 - angle;
    
    // Update metrics
    c.querySelector('#angleAC').textContent = angleAC.toFixed(1) + '°';
    c.querySelector('#angleBD').textContent = angleBD.toFixed(1) + '°';
    c.querySelector('#sumAB').textContent = (angleAC + angleBD).toFixed(1) + '°';
    
    // Line endpoints
    const m1 = {x: cx - lineLen, y: cy};
    const m2 = {x: cx + lineLen, y: cy};
    const l1 = {x: cx - lineLen * Math.cos(toRad(angle)), y: cy + lineLen * Math.sin(toRad(angle))};
    const l2 = {x: cx + lineLen * Math.cos(toRad(angle)), y: cy - lineLen * Math.sin(toRad(angle))};
    
    // Arc paths
    const arcR = 35;
    const arcR2 = 50;
    
    function arcPath(startAng, endAng, r) {
      const s = toRad(startAng);
      const e = toRad(endAng);
      const x1 = cx + r * Math.cos(s);
      const y1 = cy + r * Math.sin(s);
      const x2 = cx + r * Math.cos(e);
      const y2 = cy + r * Math.sin(e);
      const large = Math.abs(endAng - startAng) > 180 ? 1 : 0;
      return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
    }
    
    svg.innerHTML = `
      <!-- Angle arcs -->
      <path d="${arcPath(-angle, 0, arcR)}" class="angle-arc angle-a"/>
      <path d="${arcPath(180-angle, 180, arcR)}" class="angle-arc angle-a"/>
      <path d="${arcPath(180, 360-angle, arcR2)}" class="angle-arc angle-b"/>
      <path d="${arcPath(0, 180-angle, arcR2)}" class="angle-arc angle-b"/>
      
      <!-- Lines -->
      <line x1="${m1.x}" y1="${m1.y}" x2="${m2.x}" y2="${m2.y}" class="line-m"/>
      <line x1="${l1.x}" y1="${l1.y}" x2="${l2.x}" y2="${l2.y}" class="line-l"/>
      
      <!-- Labels -->
      <text x="${m2.x + 8}" y="${m2.y + 4}" font-size="14" fill="#2c3e50" font-weight="600">m</text>
      <text x="${l2.x + 8}" y="${l2.y - 4}" font-size="14" fill="#8e44ad" font-weight="600">l</text>
      
      <!-- Angle labels -->
      <text x="${cx + 55}" y="${cy - 15}" font-size="12" fill="#e74c3c" font-weight="600">∠a</text>
      <text x="${cx - 65}" y="${cy + 20}" font-size="12" fill="#e74c3c" font-weight="600">∠c</text>
      <text x="${cx - 65}" y="${cy - 15}" font-size="12" fill="#3498db" font-weight="600">∠b</text>
      <text x="${cx + 55}" y="${cy + 20}" font-size="12" fill="#3498db" font-weight="600">∠d</text>
      
      <!-- Intersection point -->
      <circle cx="${cx}" cy="${cy}" r="5" class="intersection-point"/>
      
      ${isInteractive ? `
      <!-- Drag handle -->
      <circle cx="${l2.x}" cy="${l2.y}" r="14" class="drag-handle" id="dragHandle"/>
      ` : ''}
    `;
  }
  
  render();
  
  if (isInteractive) {
    // Drag handling
    const dragHandle = () => c.querySelector('#dragHandle');
    let dragging = false;
    
    function getAngleFromPoint(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const svgX = (clientX - rect.left) / rect.width * 400;
      const svgY = (clientY - rect.top) / rect.height * 300;
      const dx = svgX - cx;
      const dy = cy - svgY;
      let a = Math.atan2(dy, dx) * 180 / Math.PI;
      return Math.max(15, Math.min(165, a));
    }
    
    svg.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const handle = dragHandle();
      const rect = handle.getBoundingClientRect();
      const dist = Math.hypot(touch.clientX - rect.left - 14, touch.clientY - rect.top - 14);
      if (dist < 40) {
        dragging = true;
        c.querySelector('.static-hint')?.remove();
      }
    });
    
    svg.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      angle = getAngleFromPoint(e.touches[0].clientX, e.touches[0].clientY);
      render();
    });
    
    svg.addEventListener('touchend', () => { dragging = false; });
    
    // Mouse fallback
    svg.addEventListener('mousedown', (e) => {
      if (e.target.id === 'dragHandle') {
        dragging = true;
        c.querySelector('.static-hint')?.remove();
      }
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      angle = getAngleFromPoint(e.clientX, e.clientY);
      render();
    });
    
    document.addEventListener('mouseup', () => { dragging = false; });
    
    // Control panel
    const toggleBtn = c.querySelector('.control-toggle');
    const overlay = c.querySelector('.control-overlay');
    const slider = c.querySelector('#angleSlider');
    const sliderVal = c.querySelector('#slider_val');
    const submitBtn = c.querySelector('.submit-btn');
    
    toggleBtn.addEventListener('click', () => {
      overlay.classList.toggle('open');
      toggleBtn.textContent = overlay.classList.contains('open') ? 'Close' : 'Adjust';
    });
    
    slider.addEventListener('input', () => {
      sliderVal.textContent = slider.value + '°';
    });
    
    submitBtn.addEventListener('click', () => {
      angle = parseFloat(slider.value);
      render();
      overlay.classList.remove('open');
      toggleBtn.textContent = 'Adjust';
    });
  }
}

// Create simulations
createSimulation('ref', false, 60);
createSimulation('exp', true, 60);
</script>
</body>
</html>
