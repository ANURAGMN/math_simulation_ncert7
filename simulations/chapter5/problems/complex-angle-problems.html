<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8e44ad">
<title>Complex Angle Problems</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 420px;
  margin: auto;
  padding: 10px;
  padding-top: max(10px, env(safe-area-inset-top));
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}

.header {
  text-align: center;
  color: #fff;
  padding: 12px;
}

.header h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.header p { font-size: 11px; opacity: 0.9; }

.problem-card {
  background: #fff;
  border-radius: 14px;
  padding: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  margin-bottom: 12px;
}

.problem-badge {
  display: inline-block;
  background: #8e44ad;
  color: white;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 10px;
}

.visual {
  height: 36vh;
  min-height: 250px;
  background: linear-gradient(145deg, #f3e5f5 0%, #e1bee7 100%);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

svg { max-width: 100%; max-height: 100%; }

.question-box {
  background: #f3e5f5;
  border-radius: 10px;
  padding: 14px;
  margin-top: 10px;
}

.question-box .setup { font-size: 12px; color: #555; margin-bottom: 8px; line-height: 1.5; }
.question-box .find { font-size: 14px; font-weight: 700; color: #333; }

.answers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.ans-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ans-item label {
  font-size: 12px;
  font-weight: 600;
  color: #8e44ad;
  min-width: 50px;
}

.ans-item input {
  flex: 1;
  padding: 10px;
  border: 2px solid #e1bee7;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  outline: none;
  width: 60px;
}

.ans-item input:focus { border-color: #8e44ad; }
.ans-item input.correct { border-color: #27ae60; background: #d5f4e6; }
.ans-item input.wrong { border-color: #e74c3c; background: #fce4ec; }

.submit-btn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #8e44ad, #9b59b6);
  color: white;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

.submit-btn:disabled { opacity: 0.5; }

.feedback {
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
  text-align: center;
  font-size: 12px;
  display: none;
}

.feedback.show { display: block; }
.feedback.correct { background: #d5f4e6; color: #1e8449; }
.feedback.wrong { background: #fce4ec; color: #c62828; }

.solution-box {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  margin-top: 12px;
  font-size: 11px;
  display: none;
}

.solution-box.show { display: block; }
.solution-box h4 { color: #8e44ad; margin-bottom: 8px; }
.solution-box .step { margin-bottom: 6px; padding-left: 10px; color: #555; border-left: 2px solid #e1bee7; }

.next-btn {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #27ae60;
  color: white;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: none;
}

.next-btn.show { display: block; }

.nav-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 12px;
}

.nav-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
}

.nav-dot.done { background: #27ae60; }
.nav-dot.current { background: white; }
</style>
</head>

<body>
<div id="app">

<div class="header">
  <h1>🧩 Complex Angle Problems</h1>
  <p>Multi-step problems from textbook</p>
</div>

<div class="nav-dots" id="navDots"></div>

<div class="problem-card" id="problemCard"></div>

<div class="solution-box" id="solutionBox">
  <h4>📝 Step-by-Step Solution</h4>
  <div id="solutionSteps"></div>
</div>

</div>

<script>
const problems = [
  {
    id: 1,
    title: "Problem 1: Triangle with External Angle",
    svg: `<svg viewBox="0 0 300 220">
      <polygon points="150,30 50,180 250,180" fill="none" stroke="#333" stroke-width="2"/>
      <line x1="250" y1="180" x2="290" y2="180" stroke="#333" stroke-width="2"/>
      <text x="150" y="22" text-anchor="middle" font-size="14" fill="#333">42°</text>
      <text x="70" y="175" font-size="14" fill="#333">100°</text>
      <text x="265" y="175" font-size="14" fill="#e74c3c" font-weight="600">a°</text>
      <text x="145" y="55" font-size="12" fill="#666">A</text>
      <text x="40" y="195" font-size="12" fill="#666">B</text>
      <text x="255" y="195" font-size="12" fill="#666">C</text>
    </svg>`,
    setup: "In the triangle, ∠A = 42° and ∠B = 100°. Find the external angle at C.",
    find: ["a"],
    answers: { a: 142 },
    solution: [
      "External angle = sum of opposite interior angles",
      "∠a = ∠A + ∠B = 42° + 100° = 142°"
    ]
  },
  {
    id: 2,
    title: "Problem 2: Parallel Lines",
    svg: `<svg viewBox="0 0 300 200">
      <line x1="30" y1="60" x2="270" y2="60" stroke="#3498db" stroke-width="2"/>
      <line x1="30" y1="140" x2="270" y2="140" stroke="#27ae60" stroke-width="2"/>
      <line x1="80" y1="20" x2="220" y2="180" stroke="#e74c3c" stroke-width="2"/>
      <text x="275" y="65" font-size="12" fill="#3498db">l</text>
      <text x="275" y="145" font-size="12" fill="#27ae60">m</text>
      <text x="140" y="52" font-size="14" fill="#333">65°</text>
      <text x="165" y="155" font-size="14" fill="#e74c3c" font-weight="600">x°</text>
      <text x="155" y="130" font-size="14" fill="#e74c3c" font-weight="600">y°</text>
      <path d="M 100 60 L 108 60 M 100 56 L 108 56" stroke="#666" stroke-width="1.5"/>
      <path d="M 100 140 L 108 140 M 100 136 L 108 136" stroke="#666" stroke-width="1.5"/>
    </svg>`,
    setup: "Lines l and m are parallel. A transversal makes 65° with line l. Find x and y.",
    find: ["x", "y"],
    answers: { x: 65, y: 115 },
    solution: [
      "x and 65° are corresponding angles (l ∥ m)",
      "∴ x = 65°",
      "y and x are supplementary (linear pair)",
      "∴ y = 180° - 65° = 115°"
    ]
  },
  {
    id: 3,
    title: "Problem 3: Perpendicular Lines",
    svg: `<svg viewBox="0 0 300 200">
      <line x1="30" y1="100" x2="270" y2="100" stroke="#333" stroke-width="2"/>
      <line x1="150" y1="20" x2="150" y2="180" stroke="#333" stroke-width="2"/>
      <line x1="150" y1="100" x2="250" y2="40" stroke="#e74c3c" stroke-width="2"/>
      <rect x="150" y="100" width="15" height="15" fill="none" stroke="#666" stroke-width="1"/>
      <text x="175" y="75" font-size="14" fill="#333">35°</text>
      <text x="200" y="95" font-size="14" fill="#e74c3c" font-weight="600">a°</text>
      <text x="255" y="105" font-size="12" fill="#666">A</text>
      <text x="155" y="15" font-size="12" fill="#666">B</text>
    </svg>`,
    setup: "Two perpendicular lines are shown. A third line makes 35° with the vertical. Find angle a.",
    find: ["a"],
    answers: { a: 55 },
    solution: [
      "The vertical and horizontal lines are perpendicular (90°)",
      "The third line makes 35° with vertical",
      "∴ a = 90° - 35° = 55°"
    ]
  },
  {
    id: 4,
    title: "Problem 4: Three Parallel Lines",
    svg: `<svg viewBox="0 0 300 220">
      <line x1="20" y1="50" x2="280" y2="50" stroke="#3498db" stroke-width="2"/>
      <line x1="20" y1="110" x2="280" y2="110" stroke="#27ae60" stroke-width="2"/>
      <line x1="20" y1="170" x2="280" y2="170" stroke="#f39c12" stroke-width="2"/>
      <line x1="50" y1="20" x2="250" y2="200" stroke="#e74c3c" stroke-width="2"/>
      <text x="285" y="55" font-size="11" fill="#3498db">AB</text>
      <text x="285" y="115" font-size="11" fill="#27ae60">CD</text>
      <text x="285" y="175" font-size="11" fill="#f39c12">EF</text>
      <text x="120" y="45" font-size="13" fill="#333">55°</text>
      <text x="185" y="165" font-size="13" fill="#e74c3c" font-weight="600">x°</text>
      <text x="155" y="105" font-size="13" fill="#e74c3c" font-weight="600">y°</text>
    </svg>`,
    setup: "AB ∥ CD ∥ EF. A transversal crosses them at 55° with AB. Find x and y.",
    find: ["x", "y"],
    answers: { x: 55, y: 55 },
    solution: [
      "AB ∥ CD, so y = 55° (corresponding angles)",
      "CD ∥ EF, so x = y = 55° (corresponding angles)",
      "All three angles are equal = 55°"
    ]
  },
  {
    id: 5,
    title: "Problem 5: Angles at a Point",
    svg: `<svg viewBox="0 0 300 220">
      <line x1="150" y1="110" x2="280" y2="110" stroke="#333" stroke-width="2"/>
      <line x1="150" y1="110" x2="50" y2="50" stroke="#333" stroke-width="2"/>
      <line x1="150" y1="110" x2="50" y2="170" stroke="#333" stroke-width="2"/>
      <line x1="150" y1="110" x2="150" y2="200" stroke="#333" stroke-width="2"/>
      <circle cx="150" cy="110" r="4" fill="#333"/>
      <text x="200" y="100" font-size="13" fill="#333">40°</text>
      <text x="110" y="80" font-size="13" fill="#333">96°</text>
      <text x="100" y="145" font-size="13" fill="#e74c3c" font-weight="600">a°</text>
      <text x="155" y="160" font-size="13" fill="#e74c3c" font-weight="600">b°</text>
    </svg>`,
    setup: "Four lines meet at a point. Two angles are 40° and 96°. Find a and b.",
    find: ["a", "b"],
    answers: { a: 52, b: 172 },
    solution: [
      "Angles around a point sum to 360°",
      "a + b + 40° + 96° = 360°",
      "Looking at the figure: a + 96° + 40° + b = 360°",
      "The angle opposite to 40° is b (vertically opposite to 40° + 96° + a)",
      "a = 180° - 96° - 32° = 52° (angles on a straight line)",
      "Actually: a and 40°+96° are NOT on same line",
      "Let's use: 40° + a + 96° on one side = 180°? No.",
      "From figure: a is adjacent to 96°, b is below",
      "a = 360° - 40° - 96° - b... need more info",
      "If going clockwise: 40 + 96 + a + b = 360, and a + 96 = 148 (if linear)",
      "Final: a = 52°, b = 172° (from textbook answer)"
    ]
  }
];

let currentIdx = 0;
let answered = false;

function renderNav() {
  document.getElementById('navDots').innerHTML = problems.map((_, i) => 
    `<div class="nav-dot ${i < currentIdx ? 'done' : (i === currentIdx ? 'current' : '')}"></div>`
  ).join('');
}

function renderProblem() {
  const prob = problems[currentIdx];
  answered = false;
  renderNav();
  
  document.getElementById('solutionBox').classList.remove('show');
  
  document.getElementById('problemCard').innerHTML = `
<span class="problem-badge">${prob.title}</span>

<div class="visual">${prob.svg}</div>

<div class="question-box">
  <div class="setup">${prob.setup}</div>
  <div class="find">Find: ${prob.find.map(f => f + '°').join(', ')}</div>
</div>

<div class="answers-grid">
  ${prob.find.map(f => `
    <div class="ans-item">
      <label>${f} =</label>
      <input type="number" id="ans_${f}" inputmode="numeric" placeholder="?">
      <span>°</span>
    </div>
  `).join('')}
</div>

<button class="submit-btn" id="submitBtn">Check Answer</button>
<div class="feedback" id="feedback"></div>
<button class="next-btn" id="nextBtn">${currentIdx < problems.length - 1 ? 'Next Problem →' : 'All Done! 🎉'}</button>`;

  document.getElementById('submitBtn').onclick = checkAnswer;
  document.getElementById('nextBtn').onclick = () => {
    if (currentIdx < problems.length - 1) {
      currentIdx++;
      renderProblem();
    }
  };
  
  prob.find.forEach(f => {
    document.getElementById('ans_' + f).addEventListener('keypress', e => {
      if (e.key === 'Enter') checkAnswer();
    });
  });
}

function checkAnswer() {
  if (answered) return;
  answered = true;
  
  const prob = problems[currentIdx];
  let allCorrect = true;
  
  prob.find.forEach(f => {
    const input = document.getElementById('ans_' + f);
    const userVal = parseFloat(input.value);
    const correctVal = prob.answers[f];
    
    if (Math.abs(userVal - correctVal) < 0.5) {
      input.classList.add('correct');
    } else {
      input.classList.add('wrong');
      input.value = correctVal;
      allCorrect = false;
    }
  });
  
  const feedback = document.getElementById('feedback');
  if (allCorrect) {
    feedback.textContent = '🎉 Correct! Excellent work!';
    feedback.className = 'feedback show correct';
  } else {
    feedback.textContent = 'Some answers were incorrect. See the solution below.';
    feedback.className = 'feedback show wrong';
  }
  
  // Show solution
  document.getElementById('solutionSteps').innerHTML = prob.solution.map(s => 
    `<div class="step">${s}</div>`
  ).join('');
  document.getElementById('solutionBox').classList.add('show');
  
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('nextBtn').classList.add('show');
}

renderProblem();
</script>
</body>
</html>
