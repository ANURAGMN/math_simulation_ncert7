<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Parallel Lines & Transversal</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
  touch-action: manipulation;
}

#app {
  max-width: 420px;
  margin: auto;
  padding: 10px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  margin: 8px 4px;
  color: #444;
}

.sim-card {
  background: #fff;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}

.visual {
  position: relative;
  height: 38vh;
  min-height: 260px;
  background: linear-gradient(135deg, #f093fb15 0%, #f5576c15 100%);
  border-radius: 12px;
  overflow: hidden;
  touch-action: none;
}

svg { width: 100%; height: 100%; }

.static-hint {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(255,255,255,0.95);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 11px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
  color: #f5576c;
  font-weight: 500;
}

.metrics {
  position: absolute;
  left: 8px;
  bottom: 8px;
  background: rgba(255,255,255,0.96);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 11px;
  line-height: 1.4;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
}

.metrics .row {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
}

.metrics .angle-box {
  padding: 3px 6px;
  border-radius: 4px;
  font-weight: 600;
  font-size: 10px;
}

.metrics .a1 { background: #e74c3c20; color: #c0392b; }
.metrics .a2 { background: #3498db20; color: #2980b9; }
.metrics .divider {
  border-top: 1px solid #eee;
  padding-top: 4px;
  margin-top: 4px;
}

.control-toggle {
  position: absolute;
  right: 8px;
  top: 8px;
  background: #f5576c;
  color: #fff;
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.control-overlay {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.98);
  border-top: 1px solid #ddd;
  border-radius: 16px 16px 0 0;
  padding: 16px;
  transform: translateY(100%);
  transition: transform .25s ease;
  max-height: 60%;
  overflow-y: auto;
}

.control-overlay.open { transform: translateY(0); }

.control-group {
  margin-bottom: 12px;
}

.control-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
  color: #333;
}

.control-label span:last-child {
  font-weight: 700;
  color: #f5576c;
}

.control-group input[type="range"] {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: #e0e0e0;
  -webkit-appearance: none;
}

.control-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #f5576c;
  border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.highlight-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.highlight-btn {
  flex: 1;
  min-width: 45%;
  padding: 8px;
  border-radius: 8px;
  border: 2px solid #e0e0e0;
  background: white;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.highlight-btn.active {
  background: #f5576c;
  color: white;
  border-color: #f5576c;
}

.submit-btn {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #f5576c;
  color: white;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

.concept-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  margin-bottom: 12px;
}

.concept-card h3 {
  font-size: 14px;
  color: #333;
  margin-bottom: 8px;
}

.concept-card p {
  font-size: 12px;
  color: #666;
  line-height: 1.5;
}

.concept-card .rule {
  background: #f5576c15;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
  font-size: 11px;
}

.concept-card .rule strong { color: #f5576c; }

/* SVG */
.line-l { stroke: #3498db; stroke-width: 3; }
.line-m { stroke: #27ae60; stroke-width: 3; }
.line-t { stroke: #e74c3c; stroke-width: 3; }
</style>
</head>

<body>
<div id="app">
  <div class="section-title">Reference (transversal at 60°)</div>
  <div class="sim-card" id="ref"></div>
  
  <div class="section-title">Experiment (change angle)</div>
  <div class="sim-card" id="exp"></div>
  
  <div class="concept-card">
    <h3>What to observe</h3>
    <p>Line <b style="color:#e74c3c">t</b> (transversal) cuts parallel lines <b style="color:#3498db">l</b> and <b style="color:#27ae60">m</b>.</p>
    <div class="rule">
      <p><strong>Corresponding:</strong> ∠1=∠5, ∠2=∠6... (same position, equal)</p>
      <p style="margin-top:4px;"><strong>Alternate:</strong> ∠3=∠6, ∠4=∠5 (opposite sides, equal)</p>
      <p style="margin-top:4px;"><strong>Co-interior:</strong> ∠3+∠5=180°, ∠4+∠6=180°</p>
    </div>
  </div>
</div>

<script>
function createSimulation(containerId, isInteractive, initialAngle) {
  const c = document.getElementById(containerId);
  let angle = initialAngle;
  let highlight = 'none';
  
  function getAngles() {
    const a = angle;
    const b = 180 - angle;
    return {a1:a, a2:b, a3:a, a4:b, a5:a, a6:b, a7:a, a8:b};
  }
  
  function getMetricsHtml() {
    const ang = getAngles();
    return `
      <div style="font-weight:600;margin-bottom:4px;font-size:10px;color:#666;">At line l:</div>
      <div class="row">
        <span class="angle-box a1">∠1=${ang.a1.toFixed(0)}°</span>
        <span class="angle-box a2">∠2=${ang.a2.toFixed(0)}°</span>
        <span class="angle-box a1">∠3=${ang.a3.toFixed(0)}°</span>
        <span class="angle-box a2">∠4=${ang.a4.toFixed(0)}°</span>
      </div>
      <div style="font-weight:600;margin:6px 0 4px;font-size:10px;color:#666;">At line m:</div>
      <div class="row">
        <span class="angle-box a1">∠5=${ang.a5.toFixed(0)}°</span>
        <span class="angle-box a2">∠6=${ang.a6.toFixed(0)}°</span>
        <span class="angle-box a1">∠7=${ang.a7.toFixed(0)}°</span>
        <span class="angle-box a2">∠8=${ang.a8.toFixed(0)}°</span>
      </div>
      <div class="divider">
        <span style="color:#666;">∠3+∠5 = </span><span style="font-weight:700;">${(ang.a3+ang.a5).toFixed(0)}°</span>
      </div>
    `;
  }

  const controlsHtml = `
    <div class="control-group">
      <div class="control-label">
        <span>Transversal angle</span>
        <span id="slider_val">${angle}°</span>
      </div>
      <input type="range" id="angleSlider" min="25" max="155" step="1" value="${angle}">
    </div>
    <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:#333;">Highlight angle pairs:</div>
    <div class="highlight-btns">
      <button class="highlight-btn active" data-type="none">None</button>
      <button class="highlight-btn" data-type="corresponding">Corresponding</button>
      <button class="highlight-btn" data-type="alternate">Alternate</button>
      <button class="highlight-btn" data-type="cointerior">Co-interior</button>
    </div>
  `;

  c.innerHTML = `
  <div class="visual">
    ${isInteractive ? '<div class="static-hint">Drag ↻ transversal</div>' : ''}
    ${isInteractive ? '<button class="control-toggle">Adjust</button>' : ''}
    
    <svg viewBox="0 0 400 300" id="svg_${containerId}"></svg>
    
    <div class="metrics" id="metricsBox">${getMetricsHtml()}</div>
    
    ${isInteractive ? `
    <div class="control-overlay">
      ${controlsHtml}
      <button class="submit-btn">Apply Changes</button>
    </div>` : ''}
  </div>`;

  const svg = c.querySelector('svg');
  const gap = 90;
  const ly = 105, my = ly + gap;
  
  function toRad(d) { return d * Math.PI / 180; }
  
  function render() {
    const ang = getAngles();
    c.querySelector('#metricsBox').innerHTML = getMetricsHtml();
    
    // Transversal intersection points
    const intL = {x: 200, y: ly};
    const intM = {x: 200 + gap / Math.tan(toRad(angle)), y: my};
    
    // Transversal endpoints
    const tLen = 80;
    const t1 = {x: intL.x - tLen * Math.cos(toRad(angle)), y: intL.y + tLen * Math.sin(toRad(angle))};
    const t2 = {x: intM.x + tLen * Math.cos(toRad(angle)), y: intM.y - tLen * Math.sin(toRad(angle))};
    
    // Highlight colors
    function getHighlight(angleNum) {
      if (highlight === 'corresponding') {
        if ([1,5].includes(angleNum) || [2,6].includes(angleNum) || 
            [3,7].includes(angleNum) || [4,8].includes(angleNum)) {
          return (angleNum % 2 === 1) ? '#e74c3c' : '#3498db';
        }
      } else if (highlight === 'alternate') {
        if ([3,6].includes(angleNum) || [4,5].includes(angleNum)) return '#9b59b6';
      } else if (highlight === 'cointerior') {
        if ([3,5].includes(angleNum) || [4,6].includes(angleNum)) return '#f39c12';
      }
      return 'transparent';
    }
    
    // Arc paths
    const arcR = 20;
    function arcPath(cx, cy, startAng, endAng) {
      const s = toRad(startAng);
      const e = toRad(endAng);
      const x1 = cx + arcR * Math.cos(s);
      const y1 = cy + arcR * Math.sin(s);
      const x2 = cx + arcR * Math.cos(e);
      const y2 = cy + arcR * Math.sin(e);
      return `M ${cx} ${cy} L ${x1} ${y1} A ${arcR} ${arcR} 0 0 1 ${x2} ${y2} Z`;
    }
    
    // Angle arcs at line l
    const arcsL = `
      <path d="${arcPath(intL.x, intL.y, -angle, 0)}" fill="${getHighlight(1)}" opacity="0.4"/>
      <path d="${arcPath(intL.x, intL.y, 180, 360-angle)}" fill="${getHighlight(2)}" opacity="0.4"/>
      <path d="${arcPath(intL.x, intL.y, 180-angle, 180)}" fill="${getHighlight(3)}" opacity="0.4"/>
      <path d="${arcPath(intL.x, intL.y, 0, 180-angle)}" fill="${getHighlight(4)}" opacity="0.4"/>
    `;
    
    // Angle arcs at line m
    const arcsM = `
      <path d="${arcPath(intM.x, intM.y, -angle, 0)}" fill="${getHighlight(5)}" opacity="0.4"/>
      <path d="${arcPath(intM.x, intM.y, 180, 360-angle)}" fill="${getHighlight(6)}" opacity="0.4"/>
      <path d="${arcPath(intM.x, intM.y, 180-angle, 180)}" fill="${getHighlight(7)}" opacity="0.4"/>
      <path d="${arcPath(intM.x, intM.y, 0, 180-angle)}" fill="${getHighlight(8)}" opacity="0.4"/>
    `;
    
    svg.innerHTML = `
      ${arcsL}
      ${arcsM}
      
      <!-- Parallel lines -->
      <line x1="50" y1="${ly}" x2="350" y2="${ly}" class="line-l"/>
      <line x1="50" y1="${my}" x2="350" y2="${my}" class="line-m"/>
      
      <!-- Parallel marks -->
      <path d="M 120 ${ly-6} L 130 ${ly-6} M 120 ${ly-2} L 130 ${ly-2}" stroke="#666" stroke-width="2" fill="none"/>
      <path d="M 120 ${my-6} L 130 ${my-6} M 120 ${my-2} L 130 ${my-2}" stroke="#666" stroke-width="2" fill="none"/>
      
      <!-- Transversal -->
      <line x1="${t1.x}" y1="${t1.y}" x2="${t2.x}" y2="${t2.y}" class="line-t"/>
      
      <!-- Labels -->
      <text x="355" y="${ly+4}" font-size="14" fill="#3498db" font-weight="600">l</text>
      <text x="355" y="${my+4}" font-size="14" fill="#27ae60" font-weight="600">m</text>
      <text x="${t2.x+5}" y="${t2.y-5}" font-size="14" fill="#e74c3c" font-weight="600">t</text>
      
      <!-- Angle labels at l -->
      <text x="${intL.x+25}" y="${intL.y-8}" font-size="10" fill="#c0392b">1</text>
      <text x="${intL.x-35}" y="${intL.y-8}" font-size="10" fill="#2980b9">2</text>
      <text x="${intL.x-35}" y="${intL.y+15}" font-size="10" fill="#c0392b">3</text>
      <text x="${intL.x+25}" y="${intL.y+15}" font-size="10" fill="#2980b9">4</text>
      
      <!-- Angle labels at m -->
      <text x="${intM.x+25}" y="${intM.y-8}" font-size="10" fill="#c0392b">5</text>
      <text x="${intM.x-35}" y="${intM.y-8}" font-size="10" fill="#2980b9">6</text>
      <text x="${intM.x-35}" y="${intM.y+15}" font-size="10" fill="#c0392b">7</text>
      <text x="${intM.x+25}" y="${intM.y+15}" font-size="10" fill="#2980b9">8</text>
      
      <!-- Intersection points -->
      <circle cx="${intL.x}" cy="${intL.y}" r="4" fill="#333"/>
      <circle cx="${intM.x}" cy="${intM.y}" r="4" fill="#333"/>
      
      ${isInteractive ? `<circle cx="${t2.x}" cy="${t2.y}" r="14" fill="#e74c3c" stroke="white" stroke-width="2" id="dragHandle" style="cursor:grab"/>` : ''}
    `;
  }
  
  render();
  
  if (isInteractive) {
    let dragging = false;
    const intLy = ly;
    
    function getAngleFromPoint(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const svgX = (clientX - rect.left) / rect.width * 400;
      const svgY = (clientY - rect.top) / rect.height * 300;
      const dx = svgX - 200;
      const dy = intLy - svgY;
      let a = Math.atan2(dy, dx) * 180 / Math.PI;
      if (a < 0) a += 180;
      return Math.max(25, Math.min(155, a));
    }
    
    svg.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const handle = c.querySelector('#dragHandle');
      if (!handle) return;
      const rect = handle.getBoundingClientRect();
      if (Math.hypot(touch.clientX - rect.left - 14, touch.clientY - rect.top - 14) < 40) {
        dragging = true;
        c.querySelector('.static-hint')?.remove();
      }
    });
    
    svg.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      angle = getAngleFromPoint(e.touches[0].clientX, e.touches[0].clientY);
      render();
    });
    
    svg.addEventListener('touchend', () => { dragging = false; });
    
    svg.addEventListener('mousedown', (e) => {
      if (e.target.id === 'dragHandle') {
        dragging = true;
        c.querySelector('.static-hint')?.remove();
      }
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      angle = getAngleFromPoint(e.clientX, e.clientY);
      render();
    });
    
    document.addEventListener('mouseup', () => { dragging = false; });
    
    // Controls
    const toggleBtn = c.querySelector('.control-toggle');
    const overlay = c.querySelector('.control-overlay');
    const slider = c.querySelector('#angleSlider');
    const sliderVal = c.querySelector('#slider_val');
    const submitBtn = c.querySelector('.submit-btn');
    const highlightBtns = c.querySelectorAll('.highlight-btn');
    
    toggleBtn.addEventListener('click', () => {
      overlay.classList.toggle('open');
      toggleBtn.textContent = overlay.classList.contains('open') ? 'Close' : 'Adjust';
    });
    
    slider.addEventListener('input', () => {
      sliderVal.textContent = slider.value + '°';
    });
    
    highlightBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        highlightBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        highlight = btn.dataset.type;
        render();
      });
    });
    
    submitBtn.addEventListener('click', () => {
      angle = parseFloat(slider.value);
      render();
      overlay.classList.remove('open');
      toggleBtn.textContent = 'Adjust';
    });
  }
}

createSimulation('ref', false, 60);
createSimulation('exp', true, 60);
</script>
</body>
</html>
