<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rounding & Estimation Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6f8}
#app{max-width:420px;margin:auto;padding:10px}
.section-title{font-size:13px;font-weight:600;margin:8px 4px;color:#444}
.sim-card{background:#fff;border-radius:14px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.08);margin-bottom:12px}
.visual{position:relative;min-height:220px;background:#eef3f9;border-radius:12px;overflow:hidden;touch-action:none}
svg{width:100%;height:100%;display:block}
.static-hint{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.95);border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.3;box-shadow:0 3px 8px rgba(0,0,0,.12);z-index:2;max-width:55%}
.metrics{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.96);border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.4;box-shadow:0 3px 8px rgba(0,0,0,.12);z-index:2;max-width:calc(100% - 16px)}
.control-toggle{position:absolute;right:8px;top:8px;background:#007AFF;color:#fff;font-size:11px;padding:6px 8px;border-radius:8px;border:none;cursor:pointer;z-index:2}
.control-overlay{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid #ddd;padding:8px;transform:translateY(100%);transition:transform .25s ease;z-index:5;max-height:70%;overflow-y:auto}
.control-overlay.open{transform:translateY(0)}
.control-group{margin-bottom:6px}
.control-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px}
.control-group input[type="range"]{width:100%}
.segmented{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.segmented button{flex:1;min-width:55px;padding:6px 4px;border-radius:6px;border:none;font-size:10px;background:#e0e0e0;cursor:pointer}
.segmented button.active{background:#007AFF;color:#fff;font-weight:600}
.submit-btn{width:100%;margin-top:6px;padding:8px;border-radius:8px;border:none;background:#007AFF;color:#fff;font-weight:600;cursor:pointer}
/* Estimation game */
.est-row{display:flex;gap:6px;padding:4px 8px;flex-wrap:wrap;justify-content:center}
.est-btn{padding:8px 12px;border-radius:8px;border:2px solid #e0e0e0;font-size:12px;font-weight:600;cursor:pointer;background:#fff;min-width:60px;text-align:center}
.est-btn:active{transform:scale(.96)}
.est-btn.correct{border-color:#16a34a;background:#dcfce7}
.est-btn.wrong{border-color:#dc2626;background:#fee2e2}
</style>
</head>
<body>
<div id="app">
  <div class="section-title">Reference (baseline — nearest neighbours)</div>
  <div class="sim-card" id="ref"></div>
  <div class="section-title">Experiment (estimate & verify)</div>
  <div class="sim-card" id="exp"></div>
</div>
<script>
function fmtI(n){if(n===0)return"0";let neg=n<0;if(neg)n=-n;let s=Math.round(n).toString();if(s.length<=3)return(neg?"-":"")+s;let l=s.slice(-3),r=s.slice(0,-3),p=[];while(r.length>2){p.unshift(r.slice(-2));r=r.slice(0,-2)}if(r.length)p.unshift(r);return(neg?"-":"")+p.join(",")+","+l}

function roundTo(n,place){return Math.round(n/place)*place}

const PLACES=[
  {v:1000,label:"Nearest Thousand"},
  {v:10000,label:"Nearest Ten Thousand"},
  {v:100000,label:"Nearest Lakh"},
  {v:1000000,label:"Nearest Ten Lakh"},
  {v:10000000,label:"Nearest Crore"}
];

// ── Reference: Nearest Neighbours table ──
function createRef(cid){
  const c=document.getElementById(cid);
  const NUMS=[
    {n:67285183,label:"6,72,85,183 (textbook example)"},
    {n:38769957,label:"3,87,69,957 (exercise a)"},
    {n:290532481,label:"29,05,32,481 (exercise b)"},
    {n:12442373,label:"1,24,42,373 (Mumbai pop.)"},
    {n:8425970,label:"84,25,970 (Bengaluru pop.)"}
  ];
  let idx=0;

  function render(){
    const ex=NUMS[idx],n=ex.n;
    const W=380,H=260;
    let svg="";
    // Title
    svg+=`<text x="${W/2}" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#333">${fmtI(n)}</text>`;
    svg+=`<text x="${W/2}" y="38" text-anchor="middle" font-size="9" fill="#888">${ex.label}</text>`;

    // Number line for each rounding level
    PLACES.forEach((pl,i)=>{
      const y=58+i*38;
      const rounded=roundTo(n,pl.v);
      const lower=Math.floor(n/pl.v)*pl.v;
      const upper=lower+pl.v;
      const pct=(n-lower)/(upper-lower);
      const lineX1=30,lineX2=W-30,lineW=lineX2-lineX1;
      const markerX=lineX1+pct*lineW;
      const roundedX=rounded===lower?lineX1:lineX2;

      // Track
      svg+=`<line x1="${lineX1}" y1="${y+10}" x2="${lineX2}" y2="${y+10}" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>`;
      // Ticks
      svg+=`<line x1="${lineX1}" y1="${y+4}" x2="${lineX1}" y2="${y+16}" stroke="#999" stroke-width="1.5"/>`;
      svg+=`<line x1="${lineX2}" y1="${y+4}" x2="${lineX2}" y2="${y+16}" stroke="#999" stroke-width="1.5"/>`;
      // Lower/upper labels
      svg+=`<text x="${lineX1}" y="${y+28}" text-anchor="middle" font-size="8" fill="#888">${fmtI(lower)}</text>`;
      svg+=`<text x="${lineX2}" y="${y+28}" text-anchor="middle" font-size="8" fill="#888">${fmtI(upper)}</text>`;
      // Actual position marker
      svg+=`<circle cx="${markerX}" cy="${y+10}" r="5" fill="#e74c3c"/>`;
      // Rounded snap
      svg+=`<circle cx="${roundedX}" cy="${y+10}" r="4" fill="none" stroke="#007AFF" stroke-width="2"/>`;
      // Label
      svg+=`<text x="${lineX1-4}" y="${y+12}" text-anchor="end" font-size="7" fill="#555">${pl.label.replace("Nearest ","")}</text>`;
      // Rounded value
      svg+=`<text x="${W/2}" y="${y}" text-anchor="middle" font-size="9" font-weight="600" fill="#007AFF">${fmtI(rounded)}</text>`;
    });

    c.innerHTML=`
    <div class="visual" style="min-height:${H}px">
      <div class="static-hint"><b>Nearest neighbours</b><br>Red dot = actual number<br>Blue ring = rounded value</div>
      <svg viewBox="0 0 ${W} ${H}" style="min-height:${H}px">${svg}</svg>
    </div>
    <div style="text-align:center;font-size:9px;color:#aaa;padding:4px">Tap to see next number (${idx+1}/${NUMS.length})</div>`;
  }
  c.addEventListener("click",()=>{idx=(idx+1)%NUMS.length;render()});
  render();
}

// ── Experiment: Estimation game ──
function createExp(cid){
  const c=document.getElementById(cid);

  const PROBLEMS=[
    {type:"sum",a:463128,b:419682,q:"4,63,128 + 4,19,682",exact:882810,
     qs:[
       {q:"Is the sum near 8 lakh or 9 lakh?",opts:["8 Lakh","9 Lakh"],ans:"9 Lakh"},
       {q:"Is the sum > or < 8,50,000?",opts:["> 8,50,000","< 8,50,000"],ans:"> 8,50,000"},
       {q:"Is the sum > or < 8,83,128?",opts:["> 8,83,128","< 8,83,128"],ans:"< 8,83,128"}
     ]},
    {type:"diff",a:1463128,b:490020,q:"14,63,128 − 4,90,020",exact:973108,
     qs:[
       {q:"Is the difference near 10 lakh or 9 lakh?",opts:["10 Lakh","9 Lakh"],ans:"10 Lakh"},
       {q:"Is it > or < 9,50,000?",opts:["> 9,50,000","< 9,50,000"],ans:"> 9,50,000"},
       {q:"Is it > or < 9,73,128?",opts:["> 9,73,128","< 9,73,128"],ans:"< 9,73,128"}
     ]},
    {type:"round",n:38769957,
     qs:[
       {q:"Nearest thousand of 3,87,69,957?",opts:["3,87,70,000","3,87,69,000","3,87,69,900"],ans:"3,87,70,000"},
       {q:"Nearest lakh of 3,87,69,957?",opts:["3,88,00,000","3,87,00,000","3,90,00,000"],ans:"3,88,00,000"},
       {q:"Nearest crore of 3,87,69,957?",opts:["4,00,00,000","3,00,00,000","3,90,00,000"],ans:"4,00,00,000"}
     ]},
    {type:"round",n:290532481,
     qs:[
       {q:"Nearest lakh of 29,05,32,481?",opts:["29,05,00,000","29,06,00,000","29,05,32,000"],ans:"29,05,00,000"},
       {q:"Nearest ten lakh of 29,05,32,481?",opts:["29,10,00,000","29,00,00,000","29,05,00,000"],ans:"29,10,00,000"},
       {q:"Nearest crore of 29,05,32,481?",opts:["29,00,00,000","30,00,00,000","28,00,00,000"],ans:"29,00,00,000"}
     ]},
    {type:"pop",
     qs:[
       {q:"Which city's population roughly doubled (2001→2011)?",opts:["Bengaluru","Chennai","Kolkata"],ans:"Bengaluru"},
       {q:"Pune grew by approximately?",opts:["6 Lakh","16 Lakh","60 Lakh"],ans:"6 Lakh"},
       {q:"Multiply Patna's pop by ___ to get close to Mumbai's",opts:["~3","~7","~12"],ans:"~7"}
     ]}
  ];

  let pIdx=0,qIdx=0,score=0,total=0,answered=false;
  let currentNum=38769957;
  let mode="quiz"; // quiz or explore

  function renderQuiz(){
    const prob=PROBLEMS[pIdx];
    const sq=prob.qs[qIdx];
    if(!sq){pIdx=(pIdx+1)%PROBLEMS.length;qIdx=0;renderQuiz();return}

    const W=380,H=160;
    let svg="";
    // Show context
    if(prob.type==="sum"||prob.type==="diff"){
      svg+=`<text x="${W/2}" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#333">${prob.q}</text>`;
      svg+=`<text x="${W/2}" y="45" text-anchor="middle" font-size="10" fill="#888">Estimate before computing!</text>`;
      // Number line showing approximate range
      const exact=prob.exact;
      const lo=prob.type==="sum"?800000:900000;
      const hi=prob.type==="sum"?1000000:1100000;
      const lineX1=40,lineX2=W-40,lineW=lineX2-lineX1;
      svg+=`<line x1="${lineX1}" y1="70" x2="${lineX2}" y2="70" stroke="#ddd" stroke-width="4" stroke-linecap="round"/>`;
      svg+=`<text x="${lineX1}" y="88" text-anchor="middle" font-size="8" fill="#888">${fmtI(lo)}</text>`;
      svg+=`<text x="${lineX2}" y="88" text-anchor="middle" font-size="8" fill="#888">${fmtI(hi)}</text>`;
      // Mark exact (hidden until answered)
      const pct=Math.max(0,Math.min(1,(exact-lo)/(hi-lo)));
      svg+=`<circle cx="${lineX1+pct*lineW}" cy="70" r="5" fill="#16a34a" id="exact-dot" opacity="0"/>`;
      svg+=`<text x="${lineX1+pct*lineW}" y="100" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a" id="exact-label" opacity="0">Exact: ${fmtI(exact)}</text>`;
    } else if(prob.type==="round"){
      svg+=`<text x="${W/2}" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#333">${fmtI(prob.n)}</text>`;
      svg+=`<text x="${W/2}" y="45" text-anchor="middle" font-size="10" fill="#888">Round this number</text>`;
    } else {
      svg+=`<text x="${W/2}" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#333">City Population Data</text>`;
      svg+=`<text x="${W/2}" y="45" text-anchor="middle" font-size="10" fill="#888">2001 vs 2011 Census</text>`;
    }

    let optsHtml=sq.opts.map(o=>`<button class="est-btn" data-v="${o}">${o}</button>`).join("");

    c.innerHTML=`
    <div class="visual" style="min-height:${H+60}px">
      <div class="static-hint">${sq.q}</div>
      <button class="control-toggle" id="exp-adj">Adjust</button>
      <svg viewBox="0 0 ${W} ${H}" id="exp-svg" style="min-height:${H}px">${svg}</svg>
      <div class="est-row" id="quiz-opts">${optsHtml}</div>
      <div style="text-align:center;font-size:11px;min-height:20px;padding:2px 8px" id="quiz-fb"></div>
      <div style="text-align:center;padding:4px">
        <button class="submit-btn" id="quiz-next" style="display:none;width:auto;padding:6px 20px;font-size:11px">Next</button>
      </div>
      <div class="metrics">Score: ${score}/${total} | Problem ${pIdx+1}.${qIdx+1}</div>
      <div class="control-overlay" id="exp-overlay">
        <div class="control-group">
          <div class="control-label">Mode:</div>
          <div class="segmented" id="exp-mode-seg">
            <button data-v="explore">Explore Rounding</button>
            <button class="active" data-v="quiz">Estimation Quiz</button>
          </div>
        </div>
        <button class="submit-btn" id="exp-apply">Apply Changes</button>
      </div>
    </div>`;

    answered=false;
    c.querySelector("#quiz-opts").addEventListener("click",e=>{
      const b=e.target.closest(".est-btn");if(!b||answered)return;
      answered=true;total++;
      if(b.dataset.v===sq.ans){
        b.classList.add("correct");score++;
        c.querySelector("#quiz-fb").innerHTML=`<span style="color:#16a34a;font-weight:600">Correct!</span>`;
      } else {
        b.classList.add("wrong");
        c.querySelectorAll(".est-btn").forEach(x=>{if(x.dataset.v===sq.ans)x.classList.add("correct")});
        c.querySelector("#quiz-fb").innerHTML=`<span style="color:#dc2626">Answer: ${sq.ans}</span>`;
      }
      // Reveal exact on number line
      const dot=c.querySelector("#exact-dot");if(dot)dot.setAttribute("opacity","1");
      const lbl=c.querySelector("#exact-label");if(lbl)lbl.setAttribute("opacity","1");
      c.querySelector("#quiz-next").style.display="inline-block";
    });
    c.querySelector("#quiz-next").onclick=()=>{qIdx++;renderQuiz()};
    c.querySelector("#exp-adj").onclick=()=>c.querySelector("#exp-overlay").classList.toggle("open");
    c.querySelector("#exp-apply").onclick=()=>c.querySelector("#exp-overlay").classList.remove("open");
    c.querySelector("#exp-mode-seg").addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      if(b.dataset.v==="explore"){mode="explore";renderExplore()}
    });
  }

  function renderExplore(){
    const n=currentNum;
    const W=380,H=230;
    let svg="";
    svg+=`<text x="${W/2}" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#333">${fmtI(n)}</text>`;
    PLACES.forEach((pl,i)=>{
      const y=45+i*36;
      const rounded=roundTo(n,pl.v);
      const lower=Math.floor(n/pl.v)*pl.v;
      const upper=lower+pl.v;
      const pct=(n-lower)/(upper-lower);
      const lineX1=40,lineX2=W-40,lineW=lineX2-lineX1;
      const markerX=lineX1+pct*lineW;
      svg+=`<line x1="${lineX1}" y1="${y+10}" x2="${lineX2}" y2="${y+10}" stroke="#eee" stroke-width="3" stroke-linecap="round"/>`;
      svg+=`<circle cx="${markerX}" cy="${y+10}" r="4" fill="#e74c3c"/>`;
      const rX=rounded===lower?lineX1:lineX2;
      svg+=`<circle cx="${rX}" cy="${y+10}" r="3.5" fill="none" stroke="#007AFF" stroke-width="2"/>`;
      svg+=`<text x="${lineX1}" y="${y+24}" text-anchor="middle" font-size="7" fill="#aaa">${fmtI(lower)}</text>`;
      svg+=`<text x="${lineX2}" y="${y+24}" text-anchor="middle" font-size="7" fill="#aaa">${fmtI(upper)}</text>`;
      svg+=`<text x="${lineX1-4}" y="${y+12}" text-anchor="end" font-size="7" fill="#555">${pl.label.replace("Nearest ","")}</text>`;
      svg+=`<text x="${W/2}" y="${y}" text-anchor="middle" font-size="9" font-weight="600" fill="#007AFF">${fmtI(rounded)}</text>`;
    });

    c.innerHTML=`
    <div class="visual" style="min-height:${H+30}px">
      <div class="static-hint"><b>Drag slider</b> to change the number</div>
      <button class="control-toggle" id="exp-adj">Adjust</button>
      <svg viewBox="0 0 ${W} ${H}" style="min-height:${H}px">${svg}</svg>
      <div style="padding:4px 12px">
        <input type="range" id="num-slider" min="10000" max="999999999" step="1" value="${n}" style="width:100%">
        <div style="display:flex;justify-content:space-between;font-size:8px;color:#aaa"><span>10,000</span><span>99,99,99,999</span></div>
      </div>
      <div class="control-overlay" id="exp-overlay">
        <div class="control-group">
          <div class="control-label">Mode:</div>
          <div class="segmented" id="exp-mode-seg">
            <button class="active" data-v="explore">Explore Rounding</button>
            <button data-v="quiz">Estimation Quiz</button>
          </div>
        </div>
        <div class="control-group">
          <div class="control-label">Presets:</div>
          <div class="segmented" id="exp-presets">
            <button data-v="38769957">3,87,69,957</button>
            <button data-v="290532481">29,05,32,481</button>
            <button data-v="67285183">6,72,85,183</button>
          </div>
        </div>
        <button class="submit-btn" id="exp-apply">Apply Changes</button>
      </div>
    </div>`;

    c.querySelector("#num-slider").oninput=function(){currentNum=parseInt(this.value);renderExplore()};
    c.querySelector("#exp-adj").onclick=()=>c.querySelector("#exp-overlay").classList.toggle("open");
    c.querySelector("#exp-apply").onclick=()=>c.querySelector("#exp-overlay").classList.remove("open");
    c.querySelector("#exp-mode-seg").addEventListener("click",e=>{
      const b=e.target.closest("button");if(!b)return;
      if(b.dataset.v==="quiz"){mode="quiz";qIdx=0;pIdx=0;score=0;total=0;renderQuiz()}
    });
    if(c.querySelector("#exp-presets")){
      c.querySelector("#exp-presets").addEventListener("click",e=>{
        const b=e.target.closest("button");if(!b)return;
        currentNum=parseInt(b.dataset.v);c.querySelector("#exp-overlay").classList.remove("open");renderExplore();
      });
    }
  }

  renderQuiz();
}

createRef("ref");
createExp("exp");
</script>
</body>
</html>
